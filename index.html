/* ============================================================
   十一·五、视图：阶段总结
   ============================================================ */
function sumRange(){
  if(ui.sumRange!=='custom')return rangeOf(ui.sumRange);
  if(ui.sumStart&&ui.sumEnd)return [ui.sumStart,ui.sumEnd];
  if(ui.sumStart)return [ui.sumStart,ui.sumStart];
  return rangeOf('week');
}
function cnDate(d){const [y,m,dd]=d.split('-');return `${+y}年${+m}月${+dd}日`;}
function sumTitle(s,e,kind){return `${cnDate(s)}-${cnDate(e)}${kind==='plan'?'计划建议':'小结'}`;}
/* 汇总所选范围内的事项、笔记正文与附件清单，作为 AI 材料 */
function collectSumData(s,e){
  const inR=ts=>ts>=s&&ts<=e;
  const done=DB.todos.filter(t=>t.done&&t.doneAt&&inR(dstr(new Date(t.doneAt)))).sort((a,b)=>b.doneAt-a.doneAt);
  const newNotes=DB.notes.filter(n=>inR(dstr(new Date(n.createdAt)))).sort((a,b)=>b.createdAt-a.createdAt);
  const undone=DB.todos.filter(t=>!t.done&&t.date&&t.date<=e&&t.date>=s);
  const overdue=DB.todos.filter(t=>!t.done&&t.date&&t.date<s);
  const _seen=new Set(),undoneAll=[];
  [...overdue,...undone].forEach(t=>{if(!_seen.has(t.id)){_seen.add(t.id);undoneAll.push(t);}});
  undoneAll.sort((x,y)=>(y.date||'').localeCompare(x.date||''));
  return {done,undoneAll,newNotes};
}
function attLine(list){return list&&list.length?`（附件：${list.map(a=>a.name).join('、')}）`:'';}
function buildAiContext(s,e,kind){
  const {done,undoneAll,newNotes}=collectSumData(s,e);
  const L=[`时间范围：${cnDate(s)} 至 ${cnDate(e)}`];
  L.push('\n【已完成待办】');
  L.push(done.length?done.map(t=>`- ${t.title}${t.date?'（计划 '+t.date+(t.time?' '+t.time:'')+'）':''}${t.note?'｜备注：'+t.note:''}${attLine(t.attachments)}`).join('\n'):'（无）');
  L.push('\n【未完成 / 逾期待办】');
  L.push(undoneAll.length?undoneAll.map(t=>`- ${t.title}${t.date?'（计划 '+t.date+(t.time?' '+t.time:'')+'，'+relDay(t.date)+'）':'（待安排）'}${t.note?'｜备注：'+t.note:''}${attLine(t.attachments)}`).join('\n'):'（无）');
  L.push('\n【笔记内容】');
  L.push(newNotes.length?newNotes.map(n=>`- 《${n.title||'未命名笔记'}》${n.tags&&n.tags.length?' 标签：'+n.tags.join('、'):''}\n  正文：${stripHtml(n.content).slice(0,1000)}${attLine(n.attachments)}`).join('\n'):'（无）');
  if(kind==='plan')L.push('\n请重点参考未完成 / 逾期待办，给出下一阶段可执行的计划建议。');
  return L.join('\n');
}
/* 解析 Responses 端点（/api/v3/responses）的返回结构 */
function parseDoubaoResp(j){
  if(j.output_text)return j.output_text;
  let out='';
  (j.output||[]).forEach(o=>(o.content||[]).forEach(c=>{out+=(c.text||'');}));
  return out.trim();
}
/* 调用豆包：自动兼容 chat/completions（messages）与 responses（input）两种端点；未配置 Key 时由调用方走复制兜底 */
async function callDoubao(systemPrompt,userCtx){
  const ai=DB.settings.ai||{};
  const model=ai.model||'doubao-1-5-pro-32k-250115';
  const isResp=/\/responses(\?|$)/.test(ai.base||'');
  const body=isResp
    ?{model,input:systemPrompt+'\n\n'+userCtx}
    :{model,temperature:.5,messages:[{role:'system',content:systemPrompt},{role:'user',content:userCtx}]};
  const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),120000);
  let res;
  try{
    res=await fetch(ai.base,{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+ai.key},body:JSON.stringify(body)});
  }finally{clearTimeout(timer);}
  if(!res.ok){let d='';try{d=(await res.text()).slice(0,160);}catch(e){}throw new Error('HTTP '+res.status+(d?'：'+d:''));}
  const j=await res.json();
  const txt=isResp?parseDoubaoResp(j):((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'').trim();
  if(!txt)throw new Error('返回内容为空，请检查模型 ID 是否正确');
  return txt;
}
async function aiGenerate(kind){
  if(ui.sumBusy)return;
  flushSumPrompt();
  const [s,e]=sumRange();
  const sys=kind==='plan'?DB.settings.planPrompt:DB.settings.sumPrompt;
  const ctx=buildAiContext(s,e,kind);
  ui.sumDraftKind=kind;ui.sumDraftRange=[s,e];
  const ai=DB.settings.ai||{};
  if(ai.key&&ai.base){
    ui.sumBusy=true;renderSummary();
    try{
      const txt=await callDoubao(sys,ctx);
      ui.sumDraft=txt;ui.sumBusy=false;renderSummary();
      const ta=$('#sum-result');if(ta)ta.focus();
      toast('AI 已生成，可微调后保存');
    }catch(err){
      ui.sumBusy=false;renderSummary();
      fallbackCopy(sys+'\n\n===== 以下为材料 =====\n'+ctx);
      toast('AI 调用失败（'+err.message+'），已复制提示词，可粘贴给豆包后回填');
    }
  }else{
    fallbackCopy(sys+'\n\n===== 以下为材料 =====\n'+ctx);
    ui.sumDraft=ui.sumDraft||'';renderSummary();
    const ta=$('#sum-result');if(ta)ta.focus();
    toast('未配置豆包 API Key，已复制完整提示词与材料，粘贴给豆包后把回复粘到结果框');
  }
}

const MAX_FILE=20*1048576;
const PRIS=[['high','高'],['mid','中'],['low','低']];
function nowHM(){const n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes());}
function dlOf(t){return t&&t.date?`${t.date}T${t.time||'09:00'}`:'';}
function parseTags(s){return [...new Set((s||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean))];}
function quickKind(v){const d=(v||'').slice(0,10);
  if(!d)return 'none';
  if(d===T)return 'today';
  if(d===addDays(T,1))return 'tomorrow';
  if(d===addDays(T,7))return 'nextweek';
  return '';
}
function quickDatesHtml(prefix,val){
  const k=quickKind(val);
  return [['today','今天'],['tomorrow','明天'],['nextweek','下周'],['none','无日期']].map(([v,l])=>
    `<button type="button" class="qd-btn ${k===v?'active':''}" data-act="quick-date" data-prefix="${prefix}" data-kind="${v}">${l}</button>`).join('');
}
function priSegHtml(prefix,pri){
  return `<div class="pri-seg">${PRIS.map(([v,l])=>`<button type="button" class="${pri===v?'active':''}" data-act="set-pri" data-prefix="${prefix}" data-v="${v}">${l}</button>`).join('')}</div>`;
}
function catSelectHtml(id,cur){
  return `<div class="cat-select-wrap"><span class="cs-dot" style="background:${catColor(cur)}"></span><select id="${id}">${catOptions(cur)}</select></div>`;
}
function repeatOptionsHtml(cur){
  return [['none','不重复'],['daily','每天'],['weekly','每周'],['monthly','每月']].map(([k,v])=>`<option value="${k}" ${cur===k?'selected':''}>${v}</option>`).join('');
}
async function checkFileSize(files){
  const out=[];fileJobs++;
  try{for(const f of files){if(f.size>MAX_FILE){toast('已跳过超过 20MB 的文件：'+f.name);continue;}
    const id=uid();await blobPut(id,f);out.push({id,name:f.name,size:f.size,type:f.type||'application/octet-stream',localOnly:true});}
  }catch(e){toast('附件保存失败：'+e.message);}finally{fileJobs--;}
  return out;
}
function bindDropZone(prefix,onPick){
  const zone=$('#'+prefix+'-drop'),input=$('#'+prefix+'-files');
  if(!zone||!input)return;
  input.addEventListener('change',e=>{onPick([...e.target.files]);e.target.value='';});
  ['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.add('drag');}));
  zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag');onPick([...e.dataTransfer.files]);});
}
function setQuickDate(prefix,kind){
  const dl=$('#'+prefix+'-dl');if(!dl)return;
  if(kind==='none'){dl.value='';}
  else{
    let tm=(dl.value||'').slice(11,16)||nowHM();
    const d=kind==='today'?T:kind==='tomorrow'?addDays(T,1):addDays(T,7);
    dl.value=`${d}T${tm}`;
  }
  syncQuickActive(prefix);
}
function syncQuickActive(prefix){
  const dl=$('#'+prefix+'-dl');const k=quickKind(dl?dl.value:'');
  document.querySelectorAll(`.qd-btn[data-prefix="${prefix}"]`).forEach(b=>b.classList.toggle('active',b.dataset.kind===k));
}

function fallbackCopy(txt){

  try{document.execCommand('copy');toast('总结已复制到剪贴板');}catch(e){toast('复制失败，请手动选择文本');}

let audioCtx;
function ding(){
  if(!DB.settings.doneSound)return;
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=640;o.type='sine';
    g.gain.setValueAtTime(.07,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.18);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.2);
  }catch(e){}
}
function download(name,content,mime){
  const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function htmlToMd(html){
  const d=document.createElement('div');d.innerHTML=html;
  const walk=n=>{
    let s='';
    n.childNodes.forEach(c=>{
      if(c.nodeType===3)s+=c.textContent;
      else{
        const t=c.tagName;
        const inner=walk(c);
        if(t==='H1')s+='\n# '+inner+'\n\n';
        else if(t==='H2')s+='\n## '+inner+'\n\n';
        else if(t==='B'||t==='STRONG')s+='**'+inner+'**';
        else if(t==='BLOCKQUOTE')s+=inner.split('\n').map(x=>'> '+x).join('\n')+'\n\n';
        else if(t==='UL'){[...c.children].forEach(li=>s+='- '+walk(li)+'\n');s+='\n';}
        else if(t==='OL'){[...c.children].forEach((li,i)=>s+=(i+1)+'. '+walk(li)+'\n');s+='\n';}
        else if(t==='IMG')s+='\n\n![图片]('+c.src.slice(0,48)+'…)\n\n';
        else if(t==='P')s+=inner+'\n\n';
        else if(t==='BR')s+='\n';
        else s+=inner;
      }
    });
    return s;
  };
  return walk(d).replace(/\n{3,}/g,'\n\n').trim();
}
async function exportData(kind){
  flushEditor();
  if(kind==='backup'){await exportBackup();}
  else if(kind==='md'){
    let md='# 知行记笔记导出 · '+T+'\n\n';
    DB.notes.slice().sort((a,b)=>b.updatedAt-a.updatedAt).forEach(n=>{
      md+='\n---\n\n# '+ (n.title||'未命名笔记')+'\n\n';
      md+='类型：'+catName(n.cat)+'\n\n';
      if(n.tags.length)md+='标签：'+n.tags.map(t=>'#'+t).join(' ')+'\n\n';
      md+=htmlToMd(n.content)+'\n';
    });
    download('知行记-笔记-'+T+'.md',md,'text/markdown;charset=utf-8');toast('已导出 Markdown');
  }else if(kind==='csv'){
    const rows=[['标题','类型','日期','计划时间','优先级','标签','提醒','重复','状态','备注']];
    const priName={high:'高',mid:'中',low:'低'};
    DB.todos.forEach(t=>rows.push([t.title,catName(t.cat),t.date||'待安排',t.time||'',priName[t.priority]||'中',(t.tags||[]).join('/'),t.reminder||'',repeatLabel(t.repeat)||'不重复',t.done?'已完成':'未完成',stripHtml(t.note)]));
    const csv='﻿'+rows.map(r=>r.map(x=>'"'+csvSafe(x).replace(/"/g,'""')+'"').join(',')).join('\n');
    download('知行记-待办-'+T+'.csv',csv,'text/csv;charset=utf-8');toast('已导出 CSV');
  }

function spawnNextOccurrence(t){
  if(!t.date||!['daily','weekly','monthly'].includes(t.repeat))return;
  const series=t.seriesId||t.id;t.seriesId=series;
  const anchor=t.repeatAnchorDay||pdate(t.date).getDate();t.repeatAnchorDay=anchor;
  let next;
  if(t.repeat==='monthly'){const d=pdate(t.date);d.setDate(1);d.setMonth(d.getMonth()+1);d.setDate(Math.min(anchor,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));next=dstr(d);}
  else next=addDays(t.date,t.repeat==='daily'?1:7);
  const exists=[...DB.todos,...DB.trash.todos.map(x=>x.item)].some(x=>x.seriesId===series&&x.date===next);
  if(exists)return;
  const child=JSON.parse(JSON.stringify(t));child.id=uid();child.done=false;child.doneAt=null;child.date=next;child.createdAt=Date.now();child.linkedNoteId=null;child.checklist=(t.checklist||[]).map(x=>({title:x.title,done:false}));child.dateChanges=[];delete child.weeklySource;
  for(const k of Object.keys(child))if(k.startsWith('_'))delete child[k];
  if(t.reminder){const days=Math.round((pdate(next)-pdate(t.date))/86400000);child.reminder=addDays(t.reminder.slice(0,10),days)+' '+hm(t.reminder);}
  DB.todos.push(child);
}

/* 指针拖拽排序（鼠标 / 触屏通用，按住手柄实时换位） */
function bindCatDrag(){
  const list=document.getElementById('cat-list');
  list.querySelectorAll('.cat-grip').forEach(grip=>{
    grip.addEventListener('mousedown',e=>startDrag(e,grip,false));
    grip.addEventListener('touchstart',e=>startDrag(e,grip,true),{passive:false});
  });
  function startDrag(e,grip,isTouch){
    if(e.cancelable)e.preventDefault();
    const snapshot=DB.categories.slice();
    const row=grip.closest('.cat-mrow');
    row.classList.add('dragging');
    const point=ev=>isTouch?ev.touches[0]:ev;
    function move(ev){
      if(ev.cancelable)ev.preventDefault();
      const p=point(ev),drag=list.querySelector('.dragging');if(!drag)return;
      const others=[...list.querySelectorAll('.cat-mrow:not(.dragging)')];
      let before=null;
      for(const r of others){const b=r.getBoundingClientRect();if(p.clientY<b.top+b.height/2){before=r;break;}}
      if(before)list.insertBefore(drag,before);else list.appendChild(drag);
    }
    function end(){
      document.removeEventListener(isTouch?'touchmove':'mousemove',move);
      document.removeEventListener(isTouch?'touchend':'mouseup',end);
      const drag=list.querySelector('.dragging');if(drag)drag.classList.remove('dragging');
      const order=[...list.querySelectorAll('.cat-mrow')].map(r=>Number(r.dataset.i));
      const next=order.map(i=>snapshot[i]);
      const changed=next.some((c,i)=>c.id!==DB.categories[i].id);
      if(changed){DB.categories=next;persist();openCategories();toast('顺序已更新，并同步到全部类型选择');}
    }
    document.addEventListener(isTouch?'touchmove':'mousemove',move,{passive:false});
    document.addEventListener(isTouch?'touchend':'mouseup',end);
  }
}
function catMove(i,dir){
  const j=i+dir;if(j<0||j>=DB.categories.length)return;
  const arr=DB.categories;[arr[i],arr[j]]=[arr[j],arr[i]];persist();openCategories();
}
function catAdd(){
  let name='新类型',n=2;
  const names=DB.categories.map(c=>c.name);
  while(names.includes(name)){name='新类型'+n;n++;}
  DB.categories.push({id:uid(),name});persist();openCategories();
}
function catDel(id){
  if(DB.categories.length<=1){toast('至少保留一个类型');return;}
  const rest=DB.categories.filter(c=>c.id!==id);const fallback=rest[0].id;
  DB.todos.forEach(t=>{if(t.cat===id)t.cat=fallback;});
  DB.notes.forEach(n=>{if(n.cat===id)n.cat=fallback;});
  DB.categories=rest;
  if(ui.todoCat===id)ui.todoCat='all';
  if(ui.noteCat===id)ui.noteCat='all';
  persist();openCategories();toast('已删除，相关记录归入「'+rest[0].name+'」');
}

  const c=catById(id);if(c){c.name=val.trim()||c.name;persist();}

/* ============================================================
   十七·五、浏览器通知：按 reminder 到点推送（每 30 秒巡检，改期自动重推）
   ============================================================ */
let reminderTimer=null,remindShowing=false,activeReminderKey=null,lastReminderCheck=0;
let ledgerScope='',reminderLedger={};
let notificationWorker=null,notificationWorkerPending=null,notificationWorkerError='',reminderScanBusy=false;
const liveNotifications=new Map();
let notificationLastResult={};
function prepareNotificationWorker(){
  if(notificationWorker)return Promise.resolve(notificationWorker);
  if(notificationWorkerPending)return notificationWorkerPending;
  if(!('serviceWorker'in navigator)||!isSecureContext||location.protocol==='file:')return Promise.resolve(null);
  notificationWorkerPending=(async()=>{try{
    const registration=await navigator.serviceWorker.register(new URL('./sw.js',location.href),{scope:new URL('./',location.href).pathname,updateViaCache:'none'});
    if(!registration.active)await Promise.race([navigator.serviceWorker.ready,new Promise((_,reject)=>setTimeout(()=>reject(Error('通知服务启动超时')),6000))]);
    if(!registration.active)throw Error('通知服务尚未激活');notificationWorker=registration;notificationWorkerError='';return registration;
  }catch(e){notificationWorkerError=e.message;return null;}finally{notificationWorkerPending=null;}})();return notificationWorkerPending;
}
function initNotificationWorker(){
  if('Notification'in window&&Notification.permission==='granted')prepareNotificationWorker();
  navigator.serviceWorker?.addEventListener('message',e=>{if(e.data?.type==='open-reminder-todo'&&e.data.id)openTodo(e.data.id);});
}
function ledgerKey(){return 'zhixingji-reminders-v2-'+(loadCloud().session?.uid||'local');}

function currentReminderEvents(t){
  const events=[];if(t.done)return events;
  if(t.reminder){const ts=taskStamp(t.reminder);if(Number.isFinite(ts))events.push({kind:'reminder',ts,value:t.reminder});}
  if(t.date){const ts=todoDueStamp(t);if(Number.isFinite(ts))events.push({kind:'due',ts,value:t.date+' '+(t.time||'09:00')});}
  return events.map(e=>({...e,key:t.id+'|'+e.kind+'|'+e.value,id:t.id}));
}

function mailCfg(){return DB.settings.mail||{};}
function mailReady(){const m=mailCfg();return !!(m.serviceId&&m.templateId&&m.publicKey&&mailTo());}
function mailTo(){
  const m=mailCfg();
  if(m.to&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m.to))return m.to;
  const c=loadCloud();return (c.session&&c.session.email)||'';
}
let mailErrToastAt=0;
function todoDueStamp(t){if(!t.date)return null;return taskStamp(t.date+' '+(t.time||'09:00'));}
// Browser-mode email delivery. A separate flag keeps legacy backend jobs disabled.
let mailScanBusy=false,lastMailCheck=0,mailLastError='';
function mailAutoScope(){return 'zhixingji-mail-auto-v21-'+(loadCloud().session?.uid||'local');}
function mailAutoCfg(){try{return JSON.parse(safeGet(mailAutoScope())||'null');}catch(e){return null;}}
function putMailAuto(c){localStorage.setItem(mailAutoScope(),JSON.stringify(c));}
function mailAutoEnabled(){const c=mailAutoCfg();return c?.mode==='browser'?!!c.enabled:!!DB.settings.mailOn;}
function mailModeDescription(){const c=mailAutoCfg();return c?.mode==='browser'?'网页自动发送 · 仅此设备开启期间的高优先级到期事项':'后端定时发送 · 需已部署 Supabase 邮件任务';}
function initMailAutomation(){

    if(c.mode==='browser'&&DB.settings.mailOn){DB.settings.mailOn=false;DB.settings.mailMode='browser';persist();c.disabledBackendRev=DB._rev;}

  if(c.mode==='browser'){c.enabled=enabled;if(enabled)c.startedAt=Date.now();if(DB.settings.mailOn){DB.settings.mailOn=false;persist();c.disabledBackendRev=DB._rev;}putMailAuto(c);}
  else{DB.settings.mailOn=enabled;persist();}
}
function setMailMode(mode){
  initMailAutomation();const c=mailAutoCfg();if(!['browser','backend'].includes(mode))return;

  const enabled=mailAutoEnabled();c.mode=mode;c.enabled=enabled;c.startedAt=Date.now();

  c.disabledBackendRev=mode==='browser'?DB._rev:0;putMailAuto(c);
}
function mailAutomationReason(){
  const c=mailAutoCfg();if(!c)return '正在初始化';
  if(c.mode==='backend')return DB.settings.mailOn?'后端模式：网页不扫描，请确认 Supabase 任务执行日志':'邮件提醒关闭';

  const cloud=loadCloud();if(c.disabledBackendRev&&cloud.enabled&&(!cloud.bound||cloud.dirty||cloud.remoteRev<c.disabledBackendRev))return '等待关闭后端邮件的设置同步成功，暂缓网页发送';

async function sendMailResult(subject,message){
  if(!mailReady())return {ok:false,retry:false,error:'缺少发送配置或收件邮箱'};
  const m=mailCfg(),to=mailTo();
  try{
    const response=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',signal:AbortSignal.timeout(20000),headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:m.serviceId,template_id:m.templateId,user_id:m.publicKey,template_params:{to_email:to,to_name:to,subject,title:subject,message}})});
    if(response.ok)return {ok:true};
    const detail=(await response.text()).slice(0,180);
    return {ok:false,retry:response.status===429,unknown:response.status>=500,error:'HTTP '+response.status+' '+detail};
  }catch(e){return {ok:false,retry:false,unknown:true,error:'发送结果不确定：'+e.message};}
}
async function sendMailX(subject,message){const r=await sendMailResult(subject,message);if(!r.ok){mailLastError=r.error;toast('邮件未确认发送：'+r.error);}return r.ok;}
async function checkMails(){
  if(mailScanBusy||storageBlocked)return;lastMailCheck=Date.now();initMailAutomation();if(mailAutomationReason())return;
  mailScanBusy=true;const scope=mailAutoScope();
  const run=async()=>{
    if(scope!==mailAutoScope()||mailAutomationReason())return;
    const c=mailAutoCfg(),now=Date.now();c.events=c.events||{};
    let candidate;
    for(const t of DB.todos){if(t.done||t.priority!=='high')continue;
      for(const event of currentReminderEvents(t)){
        if(event.ts>now||event.ts<c.startedAt)continue;
        if((event.kind==='due'?t._mailDueSent:t._mailRemindSent)===event.value)continue;
        const old=c.events[event.key];if(old&&(!['retry'].includes(old.state)||old.nextAt>now))continue;
        candidate={t,event};break;
      }if(candidate)break;
    }
    if(!candidate)return;
    const {t,event}=candidate,previous=c.events[event.key];
    const record={state:'sending',attempts:(previous?.attempts||0)+1,at:now,title:t.title,kind:event.kind};
    c.events[event.key]=record;putMailAuto(c);
    const result=await sendMailResult('【知行记·'+(event.kind==='due'?'截止':'提醒')+'】'+t.title,'事项「'+t.title+'」已到'+(event.kind==='due'?'截止':'提醒')+'时间：'+event.value+'（北京时间）。请及时处理。');
    // Write back into the captured account scope, never into a newly signed-in account.
    const latest=JSON.parse(safeGet(scope)||'{}');latest.events=latest.events||{};
    latest.events[event.key]={...record,state:result.ok?'accepted':result.unknown?'unknown':result.retry&&record.attempts<5?'retry':'failed',error:result.error||'',nextAt:Date.now()+Math.min(300000,30000*2**record.attempts)};
    localStorage.setItem(scope,JSON.stringify(latest));
    if(result.ok&&scope===mailAutoScope()&&byId(t.id)===t){t[event.kind==='due'?'_mailDueSent':'_mailRemindSent']=event.value;persist();}
    if(!result.ok){mailLastError=result.error;toast('自动邮件未确认发送，请查看邮件发送记录');}
  };
  try{if(navigator.locks)await navigator.locks.request(scope,{ifAvailable:true},lock=>lock?run():undefined);else await run();}
  catch(e){mailLastError=e.message;}finally{mailScanBusy=false;}
}

function saveCloud(c){try{localStorage.setItem(CLOUD_STORE,JSON.stringify(c));return true;}catch(e){showStorageError('同步设置保存失败：'+e.message);return false;}}
function cloudBase(c){return (c.url||'').trim().replace(/\/+$/,'');}
function cloudHeaders(c){return {'apikey':c.key,'Authorization':'Bearer '+(c.session&&c.session.access_token?c.session.access_token:c.key),'Content-Type':'application/json'};}
/* 邮箱注册/登录（Supabase Auth / GoTrue），登录后每个账号只读写自己的数据行 */
async function sbAuth(grant,body){
  const c=loadCloud(),base=cloudBase(c);
  if(!base||!c.key)throw new Error('请先填写项目地址和 anon 密钥');
  const r=await fetch(base+'/auth/v1/'+grant,{method:'POST',headers:{'apikey':c.key,'Content-Type':'application/json'},signal:AbortSignal.timeout(20000),body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||('HTTP '+r.status));
  return j;
}
function saveSession(j){
  const c=loadCloud();
  if(c.session?.uid!==j.user?.id){c.bound=false;c.remoteRev=0;c.dirty=false;}
  c.session={access_token:j.access_token,refresh_token:j.refresh_token,uid:j.user&&j.user.id,email:j.user&&j.user.email,expires_at:Date.now()+(j.expires_in||3600)*1000};
  c.enabled=true;c.status='idle';saveCloud(c);return c;
}
async function sbSignUp(email,pwd){
  const j=await sbAuth('signup',{email,password:pwd});
  if(!j.access_token){return {confirm:true};} // 项目开启了邮箱确认：需先去邮箱点确认链接
  saveSession(j);return {confirm:false};
}
async function sbSignIn(email,pwd){const j=await sbAuth('token?grant_type=password',{email,password:pwd});saveSession(j);return j;}
async function ensureToken(){
  const c=loadCloud(),epoch=cloudEpoch;if(!c.session)return false;
  if(c.session.expires_at&&c.session.expires_at-Date.now()>60000)return true;
  if(!c.session.refresh_token)return false;
  try{
    const j=await sbAuth('token?grant_type=refresh_token',{refresh_token:c.session.refresh_token});
    if(!cloudSessionMatches(c,epoch))return false;saveSession(j);return true;
  }catch(e){return false;}
}
function sbSignOut(){
  cloudEpoch++;
  const c=loadCloud();
  if(c.session&&c.session.access_token){fetch(cloudBase(c)+'/auth/v1/logout',{method:'POST',headers:{'apikey':c.key,'Authorization':'Bearer '+c.session.access_token}}).catch(()=>{});}
  c.session=null;c.enabled=false;c.bound=false;c.status='off';saveCloud(c);
  clearTimeout(cloudPushTimer);cloudPushTimer=null;if(cloudLoopTimer)clearInterval(cloudLoopTimer);cloudLoopTimer=null;cloudBusy=false;
}
let cloudPushTimer=null,cloudBusy=false,cloudLoopTimer=null,cloudErrToastAt=0;
function scheduleCloudPush(){
  const c=loadCloud();if(!c.enabled||!c.url||!c.key||!c.session||applyingRemote)return;
  clearTimeout(cloudPushTimer);cloudPushTimer=setTimeout(pushCloud,1500);
}
function setCloudStatus(s){const c=loadCloud();c.status=s;saveCloud(c);const el=$('#cloud-state');if(el)el.textContent=cloudStateText(s);}
function cloudStateText(s){return ({conflict:'存在版本冲突，请处理',idle:'已配置，待同步',pushing:'正在上传…',pulling:'正在同步…',ok:'已同步',error:'同步失败',off:'未启用'})[s]||s;}
async function cloudFetch(url,options={}){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),20000);try{const r=await fetch(url,{...options,signal:ctrl.signal});if(!r.ok)throw Error('HTTP '+r.status);return r;}finally{clearTimeout(timer);}}
function cloudTableURL(c){return cloudBase(c)+'/rest/v1/zxj_sync?id=eq.main&user_id=eq.'+encodeURIComponent(c.session.uid);}
function cloudSessionMatches(c,epoch){const latest=loadCloud();return cloudEpoch===epoch&&latest.enabled&&latest.session?.uid===c.session?.uid&&cloudBase(latest)===cloudBase(c);}
function localDirty(c){return !!c.dirty||(DB._rev||0)>(c.remoteRev||0);}
function cloudEditing(){return !!(editorSession&&document.querySelector('#saveState.saving'))||$('#modalMask').classList.contains('show')||fileJobs>0;}
async function fetchCloudRow(c){const r=await cloudFetch(cloudTableURL(c)+'&select=data,rev,device',{headers:cloudHeaders(c)});const rows=await r.json();if(!Array.isArray(rows))throw Error('云端响应格式错误');return rows[0]||null;}
function applyCloudRow(remote,c){
  if(storageBlocked)throw Error('本地数据待恢复，已暂停同步');
  const old=DB;const candidate=JSON.parse(JSON.stringify(remote.data));if(candidate.settings?.ai)delete candidate.settings.ai.key;
  const next=migrate(candidate);next._rev=Number(remote.rev)||0;
  disposeEditor();applyingRemote=true;
  try{DB=next;applyDevicePreferences();if(!persist(false)){DB=old;throw Error('云数据无法保存到本机');}}
  finally{applyingRemote=false;}
  ui.editingNote=null;const latest=loadCloud();latest.remoteRev=next._rev;latest.bound=true;latest.dirty=false;latest.lastUid=c.session.uid;latest.lastPullAt=Date.now();latest.status='ok';saveCloud(latest);rerenderCurrent();
}
function showCloudConflict(remote,c,force=false){
  cloudConflict={remote,uid:c.session.uid,epoch:cloudEpoch};setCloudStatus('conflict');
  if(!force&&($('#modalMask').classList.contains('show')||currentRoute()==='notes'))return;
  $('#modalMask').innerHTML=`<div class="modal" role="dialog" aria-modal="true" tabindex="-1"><div class="modal-head"><h3>发现不同的数据版本</h3></div><div class="modal-body"><p>本机和云端都可能有修改，自动同步已暂停。选择前会下载本机完整备份；不会自动合并或静默覆盖。</p><p>本机：${DB.todos.length} 条待办、${DB.notes.length} 条笔记。云端：${remote.data?.todos?.length||0} 条待办、${remote.data?.notes?.length||0} 条笔记。</p></div><div class="modal-foot"><button class="btn" data-act="close-modal">稍后处理</button><button class="btn" data-act="resolve-cloud" data-choice="remote">备份本机，采用云端</button><button class="btn btn-primary" data-act="resolve-cloud" data-choice="local">备份双方，保留本机</button></div></div>`;$('#modalMask').classList.add('show');
}
async function writeCloud(c,expected,epoch){
  if(storageBlocked||!cloudSessionMatches(c,epoch))return;
  const originalRev=DB._rev||0,nextRev=Math.max(Date.now(),originalRev,(expected||0)+1);
  const data=businessSnapshot();data._rev=nextRev;
  const payload={id:'main',user_id:c.session.uid,data,rev:nextRev,device:c.device,updated_at:new Date().toISOString()};
  const headers={...cloudHeaders(c),Prefer:expected===null?'resolution=ignore-duplicates,return=representation':'return=representation'};
  const url=expected===null?cloudBase(c)+'/rest/v1/zxj_sync':cloudTableURL(c)+'&rev=eq.'+expected;
  const response=await cloudFetch(url,{method:expected===null?'POST':'PATCH',headers,body:JSON.stringify(payload)});
  const rows=await response.json();if(!cloudSessionMatches(c,epoch))return;
  if(!Array.isArray(rows)||rows.length!==1){const remote=await fetchCloudRow(c);if(remote&&cloudSessionMatches(c,epoch))showCloudConflict(remote,c);return;}
  const latest=loadCloud();latest.remoteRev=nextRev;latest.lastPushAt=Date.now();latest.lastUid=c.session.uid;latest.bound=true;
  latest.dirty=(DB._rev||0)!==originalRev;latest.status=latest.dirty?'idle':'ok';
  if(!latest.dirty){DB._rev=nextRev;persist(false);}saveCloud(latest);
}
async function syncCloud(){
  let c=loadCloud();if(storageBlocked||!c.enabled||!c.session||cloudBusy||applyingRemote)return;
  cloudBusy=true;const epoch=cloudEpoch;
  try{
    if(!(await ensureToken()))throw Error('登录已失效，请重新登录');c=loadCloud();if(!cloudSessionMatches(c,epoch))return;
    const remote=await fetchCloudRow(c);if(!cloudSessionMatches(c,epoch))return;
    if(!remote){
      if(c.lastUid&&c.lastUid!==c.session.uid){
        setCloudStatus('conflict');cloudConflict={remote:{rev:0,data:{todos:[],notes:[]}},uid:c.session.uid,epoch,empty:true};
        if(!$('#modalMask').classList.contains('show')){
          $('#modalMask').innerHTML=`<div class="modal" role="dialog" aria-modal="true" tabindex="-1"><div class="modal-head"><h3>进入新账号的数据空间</h3></div><div class="modal-body"><p>此账号云端为空，本机仍有上一账号的内容。先下载本机完整备份，再为新账号建立空白空间。</p></div><div class="modal-foot"><button class="btn" data-act="close-modal">稍后处理</button><button class="btn btn-primary" id="empty-account-confirm">备份并进入新账号</button></div></div>`;
          $('#modalMask').classList.add('show');$('#empty-account-confirm').onclick=initializeEmptyAccount;
        }return;
      }
      await writeCloud(c,null,epoch);return;
    }
    const rRev=Number(remote.rev)||0,dirty=localDirty(c);
    if(!c.bound){
      if(c.lastUid&&c.lastUid!==c.session.uid){if(!cloudEditing())applyCloudRow(remote,c);return;}
      if(dirty){showCloudConflict(remote,c);return;}
      if(!cloudEditing())applyCloudRow(remote,c);return;
    }
    if(rRev!==(c.remoteRev||0)){
      if(dirty){showCloudConflict(remote,c);return;}
      if(!cloudEditing())applyCloudRow(remote,c);return;
    }
    if(dirty){await writeCloud(c,rRev,epoch);return;}
    setCloudStatus('ok');
  }catch(e){if(cloudSessionMatches(c,epoch))markCloudErr(e.message);}
  finally{cloudBusy=false;}
}
async function initializeEmptyAccount(){
  const c=loadCloud(),conflict=cloudConflict;if(!conflict?.empty||cloudBusy||c.session?.uid!==conflict.uid)return;
  cloudBusy=true;
  try{flushEditor();const rev=DB._rev,backup=await makeBackup();download('知行记-切换账号前备份.json',JSON.stringify(backup),'application/json');
    if(DB._rev!==rev||!cloudSessionMatches(c,conflict.epoch))throw Error('数据或账号已变化，请重试');
    const row=await fetchCloudRow(c);if(row)throw Error('新账号云端已有数据，请重新同步');
    if(!cloudSessionMatches(c,conflict.epoch))return;
    disposeEditor();const old=DB;DB=migrate({});DB._rev=Date.now();applyDevicePreferences();
    if(!persist(false)){DB=old;throw Error('本机保存失败');}
    const latest=loadCloud();latest.lastUid=c.session.uid;latest.remoteRev=0;latest.dirty=true;latest.bound=false;saveCloud(latest);
    cloudConflict=null;ui.editingNote=null;closeModal();rerenderCurrent();await writeCloud(latest,null,conflict.epoch);
  }catch(e){toast(e.message);}finally{cloudBusy=false;}
}
async function pushCloud(){return syncCloud();}
async function pullCloud(){return syncCloud();}
function markCloudErr(msg){setCloudStatus('error');if(Date.now()-cloudErrToastAt>15000){cloudErrToastAt=Date.now();toast('云同步未完成：'+msg+'；本机内容已保留');}}
function startCloudLoop(){if(cloudLoopTimer)clearInterval(cloudLoopTimer);syncCloud();cloudLoopTimer=setInterval(syncCloud,25000);}
async function resolveCloudConflict(choice){
  const conflict=cloudConflict,c=loadCloud();if(!conflict||conflict.uid!==c.session?.uid||cloudBusy)return;
  cloudBusy=true;
  try{
    flushEditor();const rev=DB._rev;const backup=await makeBackup();download('知行记-冲突前本机备份.json',JSON.stringify(backup),'application/json');
    const remote=await fetchCloudRow(c);if(!cloudSessionMatches(c,conflict.epoch)||!remote)throw Error('会话或云端数据已变化，请重新同步');
    if(DB._rev!==rev)throw Error('备份期间本机又有修改，请重试');
    if(Number(remote.rev)!==Number(conflict.remote.rev)){cloudConflict={...conflict,remote};throw Error('云端又有更新，请关闭弹窗并重新同步后选择');}
    if(choice==='remote'){closeModal();applyCloudRow(remote,c);}
    else{download('知行记-冲突前云端数据.json',JSON.stringify(remote.data),'application/json');await writeCloud(c,Number(remote.rev)||0,conflict.epoch);if(loadCloud().status!=='conflict')closeModal();}
    cloudConflict=null;
  }catch(e){toast(e.message);}finally{cloudBusy=false;}
}

function fmtSyncTime(ts){if(!ts)return '尚未';const d=new Date(ts);return d.getMonth()+1+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function copyText(txt,okMsg){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast(okMsg||'已复制')).catch(()=>fallbackCopyRaw(txt,okMsg));}
  else fallbackCopyRaw(txt,okMsg);
}
function fallbackCopyRaw(txt,okMsg){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(okMsg||'已复制');}catch(e){toast('复制失败，请手动选择');}ta.remove();}
function openCloudModal(){
  const c=loadCloud(),logged=!!c.session;
  const mask=$('#modalMask');
  mask.innerHTML=`<div role="dialog" aria-modal="true" tabindex="-1" class="modal cloud-modal">
    <div class="modal-head"><h3>账号与云同步</h3><button class="icon-x" data-act="close-modal">${I.x}</button></div>
    <div class="modal-body">
      <div class="cl-steps">
        <div class="cl-step"><b>1</b><span>到 supabase.com 免费新建一个项目，并在 SQL Editor 执行一次下方建表语句</span></div>
        <div class="cl-step"><b>2</b><span>把项目 Project URL 与 anon public 密钥填到下面（所有账号共用这一个云项目）</span></div>
        <div class="cl-step"><b>3</b><span>用邮箱注册并登录；每个账号只能看到自己的数据，互不影响，多台设备登录同一账号即同步</span></div>
      </div>
      <div class="field"><label>项目地址 Project URL</label><input type="text" id="cl-url" placeholder="https://xxxxxxxx.supabase.co" value="${esc(c.url)}" ${logged?'disabled':''}></div>
      <div class="field"><label>anon public 密钥（Settings → API）</label><input type="password" id="cl-key" placeholder="eyJhbGci……" value="${esc(c.key)}" ${logged?'disabled':''}></div>
      ${logged?`
      <div class="cl-login-box">
        <div class="cl-acc"><span class="cl-dot on"></span><b>${esc(c.session.email||'已登录账号')}</b></div>
        <div class="cl-sub">同步状态：${cloudStateText(c.status==='idle'?'ok':c.status)} · 设备 ${c.device}</div>
        <div class="cl-sub">上次上传 ${fmtSyncTime(c.lastPushAt)} · 上次拉取 ${fmtSyncTime(c.lastPullAt)}</div>
        <div class="cl-sub">离线修改保存在本机；并发修改需选择保留版本，不会静默覆盖。附件支持私有云存储；首次使用请到「我的 → 附件跨设备同步」初始化。</div>
      </div>`:`
      <div class="cl-login-box">
        <div class="field" style="margin-bottom:10px"><label>邮箱</label><input type="email" id="cl-email" placeholder="you@example.com"></div>
        <div class="field"><label>密码（至少 6 位）</label><input type="password" id="cl-pwd" placeholder="设置/输入登录密码"></div>
        <div class="cl-sub">项目地址与密钥已内置，一般无需填写；直接输入邮箱和密码，已有账号点「登录账号」，首次使用点「注册账号」。<button class="btn-text" data-act="cl-resend" style="font-size:13.5px;padding:2px 4px">重发确认邮件</button></div>
      </div>`}
      <div class="field"><label>建表语句（SQL Editor 执行一次）<button class="btn-text" data-act="cl-copy-sql" style="float:right;font-size:13.5px">复制 SQL</button></label>
        <textarea class="cl-sql" id="cl-sql" readonly>${CLOUD_SQL}</textarea>
      </div>
    </div>
    <div class="modal-foot">
      <div class="mf-l">${logged?'<button class="btn btn-ghost" data-act="cl-sync-now">立即同步</button><button class="btn btn-ghost" data-act="cl-resolve">处理版本冲突</button><button class="btn btn-ghost" data-act="cl-logout">退出登录</button>':''}</div>
      <div class="mf-r">
        <button class="btn btn-ghost" data-act="close-modal">关闭</button>
        ${logged?'':`<button class="btn btn-ghost" data-act="cl-signin">登录账号</button><button class="btn-primary btn" data-act="cl-signup">注册账号</button>`}
      </div>
    </div>
  </div>`;
  mask.classList.add('show');
}
function saveProjectCfg(){ // 仅保存云项目地址/密钥，不代表登录
  const url=($('#cl-url').value||'').trim(),key=($('#cl-key').value||'').trim();
  if(!/^https?:\/\//.test(url)){toast('请填写以 http 开头的项目地址');return false;}
  if(!key){toast('请填写 anon public 密钥');return false;}
  const c=loadCloud();c.url=url;c.key=key;saveCloud(c);return true;
}
function friendlyAuthErr(msg){
  const m=String(msg||'').toLowerCase();
  if(m.includes('not confirmed')||m.includes('email_not_confirmed'))return '该邮箱还没点确认链接：请到邮箱（含垃圾邮件）点确认，或点「重发确认邮件」';
  if(m.includes('invalid login')||m.includes('invalid credential'))return '邮箱或密码不正确（首次使用请先点注册账号）';
  if(m.includes('already registered')||m.includes('user already'))return '该邮箱已注册，请直接点登录账号';
  if(m.includes('password'))return '密码不符合要求，至少 6 位';
  return msg;
}
async function cloudAuth(kind){
  if(authBusy)return;authBusy=true;try{
  if(!saveProjectCfg())return;
  const email=($('#cl-email').value||'').trim(),pwd=$('#cl-pwd').value||'';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('请输入正确的邮箱');return;}
  if(pwd.length<6){toast('密码至少 6 位');return;}
  try{
    if(kind==='signup'){
      const r=await sbSignUp(email,pwd);
      if(r.confirm){toast('注册成功，需先到邮箱点确认链接，再点登录账号');return;}
      toast('注册成功，已登录并开始同步');
    }else{await sbSignIn(email,pwd);toast('登录成功，正在同步…');}
    openCloudModal();renderMe();startCloudLoop();
  }catch(e){toast((kind==='signup'?'注册':'登录')+'失败：'+friendlyAuthErr(e.message));}
  }finally{authBusy=false;}
}
async function cloudResend(){
  if(!saveProjectCfg())return;
  const email=($('#cl-email').value||'').trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('请先填邮箱');return;}
  try{await sbAuth('resend',{email,type:'signup'});toast('确认邮件已重发，请查收邮箱（含垃圾邮件）');}
  catch(e){toast('重发失败：'+friendlyAuthErr(e.message));}
}
function cloudLogout(){
  sbSignOut();openCloudModal();renderMe();toast('已退出登录，数据仍保存在本机');
}
window.addEventListener('online',()=>{const c=loadCloud();if(c.enabled)pullCloud();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const c=loadCloud();if(c.enabled)pullCloud();}});

initReliability();initFeatures();
renderChrome();
$('#m-new-todo').addEventListener('click',()=>openNewTodo(T));

startReminderLoop();

(function(){const c=loadCloud();if(!storageBlocked&&c.enabled&&c.url&&c.key&&c.session)startCloudLoop();})();
