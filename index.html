<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>知行记 · 知行合一</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============================================================
   知行记 V1 —— 设计变量（严格对齐方案色板 / 字体 / 尺寸体系）
   ============================================================ */
:root{
  --nav:#26356F;            /* 导航深蓝 */
  --nav-soft:#2E4085;
  --accent:#3450C5;         /* 主强调蓝 */
  --accent-hover:#405ACB;   /* Hover 蓝 */
  --accent-weak:#EAF0FE;    /* 强调蓝浅底 */
  --bg:#F4F6FA;             /* 页面背景 */
  --card:#FFFFFF;           /* 卡片背景 */
  --ink:#172033;            /* 主文字 */
  --body:#3E4657;           /* 正文 */
  --muted:#7C8599;          /* 辅助文字 */
  --border:#E3E7EF;         /* 边框 */
  --divider:#EDF0F5;        /* 弱分割线 */
  --warn-bg:#FBF4E7;        /* 逾期轻提示底（克制琥珀，不用强红） */
  --warn-line:#EAD9B8;
  --warn-ink:#946A1C;
  --ok:#2E9E6B;
  --radius:15px;
  --shadow:0 1px 2px rgba(23,32,51,.04), 0 6px 20px rgba(23,32,51,.05);
  --shadow-pop:0 12px 40px rgba(23,32,51,.16);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  --sidebar-w:216px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--sans);color:var(--body);background:var(--bg);
  font-size:16px;line-height:1.65;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;}
ul{list-style:none;}
a{color:var(--accent);text-decoration:none;cursor:pointer;}
h1,h2,h3,h4{color:var(--ink);font-weight:600;line-height:1.35;}
.serif{font-family:var(--serif);}
::selection{background:rgba(52,80,197,.18);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#D6DCE7;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ===== 整体骨架 ===== */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--nav);
  display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;
  padding:22px 14px 18px;
}
.brand{padding:6px 10px 20px;}
.brand .name{font-family:var(--serif);font-size:27px;font-weight:700;color:#fff;letter-spacing:3px;}
.brand .slogan{font-size:13px;color:rgba(255,255,255,.55);margin-top:5px;letter-spacing:1.5px;}
.nav{display:flex;flex-direction:column;gap:4px;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 15px;border-radius:11px;
  color:rgba(255,255,255,.72);font-size:16px;font-weight:500;text-align:left;white-space:nowrap;
  transition:background .15s,color .15s;
}
.nav-item svg{width:20px;height:20px;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff;}
.nav-item.active{background:#fff;color:var(--nav);font-weight:600;}
.nav-sep{height:1px;background:rgba(255,255,255,.14);margin:12px 10px;}
.sidebar-foot{margin-top:auto;padding:10px 13px 2px;display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.45);}
.sidebar-foot .seal{
  font-family:var(--serif);font-size:13.5px;letter-spacing:3px;border:1px solid rgba(255,255,255,.3);
  border-radius:6px;padding:4px 8px;color:rgba(255,255,255,.66);white-space:nowrap;flex-shrink:0;
}
.sidebar-foot small{font-size:12.5px;line-height:1.5;display:flex;flex-direction:column;gap:1px;min-width:0;}
.sidebar-foot small span{display:block;white-space:nowrap;}

.main{flex:1;margin-left:var(--sidebar-w);min-width:0;}
.view{display:none;width:100%;max-width:1380px;margin:0 auto;padding:32px 32px 64px;}
.view[data-view=todos]{max-width:920px;margin:0 auto;}
.view[data-view=home]{max-width:920px;margin:0 auto;}
/* 大屏进一步舒展，充分利用浏览器宽度 */
@media(min-width:1600px){.view{max-width:1520px;padding:38px 44px 72px;}.notes-wrap{margin:-16px -44px 0;}.view[data-view=todos],.view[data-view=home]{max-width:1013px;}}
@media(min-width:1920px){.view{max-width:1640px;}.view[data-view=todos],.view[data-view=home]{max-width:1093px;}}
.view.active{display:block;animation:fade .22s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ===== 通用组件 ===== */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.page-head .date-line{font-size:14.5px;color:var(--muted);margin-bottom:7px;letter-spacing:.5px;}
.page-head h1{font-family:var(--serif);font-size:33px;font-weight:700;letter-spacing:.5px;}
.page-head .sub{color:var(--muted);margin-top:7px;font-size:15px;}
.head-actions{display:flex;gap:10px;}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;font-size:15.5px;font-weight:500;
  border:1px solid transparent;transition:all .15s;white-space:nowrap;
}
.btn svg{width:16px;height:16px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-ghost{background:#fff;border-color:var(--border);color:var(--ink);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-text{color:var(--muted);padding:6px 10px;border-radius:8px;}
.btn-text:hover{background:var(--divider);color:var(--ink);}
.btn-danger-ghost{background:#fff;border-color:var(--border);color:#B5453B;}
.btn-danger-ghost:hover{border-color:#B5453B;background:#FDF4F3;}

.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px;
}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;gap:10px;}
.card-head h3{font-size:17.5px;font-family:var(--serif);font-weight:600;letter-spacing:.5px;}
.card-head .link{font-size:17.5px;font-family:var(--serif);font-weight:600;letter-spacing:.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.card-head .link svg{width:15px;height:15px;flex-shrink:0;}
.card-head .link:hover{color:var(--accent);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch;}
.grid-2>.card{margin-bottom:0;display:flex;flex-direction:column;}
/* 首页紧凑化：保证首屏看到足迹 */
.view[data-view=home] .page-head{margin-bottom:12px;}
.view[data-view=home] .page-head h1{margin:2px 0 3px;}
.view[data-view=home] .card{padding:13px 18px;margin-bottom:11px;}
.view[data-view=home] .todo-row{padding:5px;}
.view[data-view=home] .note-line{padding:5px;}
.view[data-view=home] .note-line .nl-sub{margin-top:2px;}
.view[data-view=home] .card-head{margin-bottom:7px;}
.view[data-view=home] .grid-2>.card{margin-bottom:0;}
.view[data-view=home] .grid-2{margin-bottom:11px;}
.view[data-view=home] .overdue-box{padding:10px 14px;margin-bottom:11px;}
.view[data-view=home] .quick-note textarea{min-height:104px;}
.view[data-view=home] .footprint{padding:11px 18px;}
.view[data-view=home]{padding-bottom:24px;}

/* 类型筛选条（笔记 / 待办共用） */
.cat-filter{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px;}
.cat-chip{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;border-radius:20px;
  padding:4px 13px;font-size:14px;color:var(--body);transition:all .13s;
}
.cat-chip:hover{border-color:var(--accent);color:var(--accent);}
.cat-chip.active{background:var(--nav);border-color:var(--nav);color:#fff;font-weight:500;}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--accent);}
.todo-meta .cat-name{display:inline-flex;align-items:center;gap:5px;color:var(--muted);}
.ni-foot .cat-name{margin-right:7px;}
.cat-select-mini{border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:14px;background:#fff;color:var(--ink);}

/* ===== 待办行 ===== */
.todo-lines{display:flex;flex-direction:column;}
.todo-row{display:flex;align-items:flex-start;gap:12px;padding:9px 6px;border-radius:10px;}
.todo-row + .todo-row{border-top:1px solid var(--divider);}
.todo-row:hover{background:#FAFBFD;}
.check{
  width:22px;height:22px;border-radius:50%;border:1.8px solid #C3CAD8;flex-shrink:0;margin-top:2px;
  display:grid;place-items:center;transition:all .15s;background:#fff;
}
.check svg{width:12px;height:12px;opacity:0;color:#fff;transform:scale(.5);transition:all .15s;}
.check:hover{border-color:var(--accent);}
.todo-row.is-done .check{background:var(--accent);border-color:var(--accent);}
.todo-row.is-done .check svg{opacity:1;transform:scale(1);}
.todo-main{flex:1;min-width:0;cursor:pointer;}
.todo-title{font-size:16px;color:var(--ink);font-weight:500;word-break:break-word;}
.todo-row.is-done .todo-title{color:var(--muted);text-decoration:line-through;text-decoration-color:#C3CAD8;}
.todo-meta{display:flex;align-items:center;gap:10px;margin-top:3px;font-size:13.5px;color:var(--muted);flex-wrap:wrap;}
.todo-meta .tag-chip{display:inline-flex;align-items:center;gap:4px;}
.todo-meta svg{width:12.5px;height:12.5px;}
.todo-side{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.time-chip{font-size:14px;color:var(--accent);background:var(--accent-weak);padding:2px 9px;border-radius:20px;font-weight:500;}
.time-chip.over{color:var(--warn-ink);background:var(--warn-bg);}
details.mini-menu{position:relative;}
details.mini-menu summary{
  list-style:none;display:grid;place-items:center;width:30px;height:30px;border-radius:8px;color:var(--muted);cursor:pointer;
}
details.mini-menu summary::-webkit-details-marker{display:none;}
details.mini-menu summary:hover{background:var(--divider);color:var(--ink);}
details.mini-menu summary svg{width:16px;height:16px;}
.mini-pop{
  position:absolute;right:0;top:32px;z-index:20;background:#fff;border:1px solid var(--border);
  border-radius:11px;box-shadow:var(--shadow-pop);padding:6px;min-width:216px;
}
.mini-pop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:14.5px;color:var(--body);}
.mini-pop button:hover{background:var(--accent-weak);color:var(--accent);}
.mini-pop .date-row{padding:6px 10px;display:flex;flex-direction:column;gap:6px;}
.mini-pop input[type=date],.mini-pop input[type=time]{width:100%;min-width:0;box-sizing:border-box;border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:14px;color:var(--ink);background:#fff;}
.mini-pop .date-lab{font-size:12.5px;color:var(--muted);padding-left:10px;margin-top:2px;}
.mini-pop hr{border:none;border-top:1px solid var(--divider);margin:5px 4px;}

.inline-add{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 6px 2px;}
.inline-add svg{width:16px;height:16px;color:var(--muted);flex-shrink:0;}
.inline-add input{
  flex:1;border:none;background:transparent;font-size:15.5px;padding:4px 2px;color:var(--ink);
}
.inline-add input::placeholder{color:#A6AEC0;}

/* 逾期轻提示 */
.overdue-card{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;}
.overdue-card .oh{display:flex;align-items:center;gap:8px;color:var(--warn-ink);font-size:14.5px;font-weight:600;margin-bottom:6px;}
.overdue-card .oh svg{width:15px;height:15px;}
.overdue-card .todo-row + .todo-row{border-top:1px dashed var(--warn-line);}
.overdue-card .todo-row:hover{background:rgba(255,255,255,.55);}

/* 空态 */
.empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:15px;}
.empty svg{width:34px;height:34px;color:#CBD2DF;margin-bottom:10px;}
.empty .et{font-family:var(--serif);font-size:16.5px;color:var(--body);margin-bottom:4px;}

/* ===== 首页快速记录 / 足迹 ===== */
.quick-note{min-height:0;}
.quick-note textarea{
  width:100%;flex:1;min-height:128px;resize:vertical;border:1px solid var(--border);border-radius:11px;
  padding:12px 14px;font-size:15.5px;line-height:1.7;background:#FCFDFF;color:var(--ink);
}
.quick-note textarea:focus{border-color:var(--accent);background:#fff;}
.quick-note .qn-files{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
.qn-file{display:inline-flex;align-items:center;gap:6px;background:var(--accent-weak);color:var(--accent);font-size:13px;border-radius:8px;padding:3px 6px 3px 9px;}
.qn-file button{display:grid;place-items:center;color:var(--accent);opacity:.6;}
.qn-file button:hover{opacity:1;}
.qn-file svg{width:11px;height:11px;}
.quick-note .qn-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;}
.quick-note .qn-hint{font-size:13.5px;color:var(--muted);}
.quick-note{position:relative;}
.quick-note .qn-drop-hint{display:none;position:absolute;inset:0;z-index:5;background:rgba(234,240,254,.96);border:1.5px dashed var(--accent);border-radius:var(--radius);place-items:center;color:var(--accent);font-size:15.5px;font-weight:600;gap:8px;pointer-events:none;}
.quick-note .qn-drop-hint svg{width:20px;height:20px;}
.quick-note.qn-drag .qn-drop-hint{display:grid;}
.quick-note.qn-drag textarea{border-color:var(--accent);}
.qn-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.qn-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;}
.qn-upload{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);border:1px solid var(--border);border-radius:9px;padding:7px 12px;cursor:pointer;background:#fff;white-space:nowrap;flex-shrink:0;}
.qn-upload:hover{color:var(--accent);border-color:var(--accent);}
.qn-upload svg{width:14px;height:14px;}
.note-lines{display:flex;flex-direction:column;}
.note-line{padding:10px 6px;border-radius:9px;cursor:pointer;}
.note-line + .note-line{border-top:1px solid var(--divider);}
.note-line:hover{background:#FAFBFD;}
.note-line .nl-title{font-size:15.5px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:7px;}
.note-line .nl-title svg{width:13px;height:13px;color:var(--accent);flex-shrink:0;}
.note-line .nl-sub{font-size:13.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tag{display:inline-block;font-size:12.5px;color:var(--accent);background:var(--accent-weak);border-radius:6px;padding:1px 7px;margin-right:5px;}
.footprint{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;cursor:pointer;}
.footprint:hover{background:#FCFDFF;}
.fp-stats{display:flex;align-items:center;gap:26px;}
.fp-num{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--nav);line-height:1.1;}
.fp-num small{font-family:var(--sans);font-size:13.5px;color:var(--muted);font-weight:400;margin-left:6px;}
.fp-go{color:var(--muted);font-size:14.5px;display:flex;align-items:center;gap:5px;}
.fp-go svg{width:15px;height:15px;}

/* ===== Tabs ===== */
.tabs{display:flex;gap:4px;background:#E9EDF5;border-radius:12px;padding:4px;margin-bottom:18px;width:fit-content;flex-wrap:wrap;}
.tab{padding:9px 18px;border-radius:9px;font-size:15px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:7px;}
.tab .cnt{font-size:13px;background:rgba(0,0,0,.08);border-radius:20px;padding:0 7px;line-height:17px;}
.tab.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(23,32,51,.08);}
.tab.active .cnt{background:var(--accent-weak);color:var(--accent);}

/* ===== 笔记双栏 ===== */
.notes-wrap{display:grid;grid-template-columns:1fr 2fr;align-items:start;margin:-16px -32px 0;}
.view.notes-view{padding-top:16px;height:100vh;display:none;flex-direction:column;overflow:hidden;}
.view.notes-view.active{display:flex;animation:none;}
.note-list-pane{
  background:var(--card);border-right:1px solid var(--border);padding:18px 17px;
  height:100vh;overflow-y:auto;
}
.search-box{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:12px;}
.search-box svg{width:15px;height:15px;color:var(--muted);flex-shrink:0;}
.search-box input{border:none;background:transparent;flex:1;font-size:15px;color:var(--ink);}
.note-group-label{font-size:13px;color:var(--muted);letter-spacing:1px;padding:10px 9px 5px;font-weight:500;}
/* 待办：工具行 / 分组折叠 / 批量条 */
.todo-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.todo-tools .cat-filter{margin-bottom:0;}
.tools-r{display:flex;align-items:center;gap:8px;}
.mini-search{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:9px;padding:6px 11px;}
.mini-search:focus-within{border-color:var(--accent);}
.mini-search svg{width:14px;height:14px;color:var(--muted);flex-shrink:0;}
.mini-search input{border:none;outline:none;background:transparent;font-size:14.5px;width:148px;color:var(--ink);}
.mini-select{border:1px solid var(--border);border-radius:9px;padding:7px 9px;font-size:14.5px;background:#fff;color:var(--body);cursor:pointer;}
.grp-head{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:none;border:none;padding:9px 6px 6px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);}
.grp-head.is-static{cursor:default;}
.grp-head:not(.is-static):hover{color:var(--accent);}
.gh-l{display:inline-flex;align-items:center;gap:6px;}
.gh-c{display:inline-grid;place-items:center;transition:transform .15s;}
.gh-c svg{width:12px;height:12px;}
.gh-c.open{transform:rotate(90deg);}
.gh-n{font-weight:400;font-size:13.5px;color:#A6AEC0;margin-left:1px;}
.grp-pager{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 4px 2px;font-size:13.5px;color:var(--muted);}
.grp-pager button{width:26px;height:26px;border:1px solid var(--border);background:#fff;border-radius:8px;display:grid;place-items:center;color:var(--body);cursor:pointer;transition:.15s;}
.grp-pager button svg{width:13px;height:13px;}
.grp-pager button:hover:not([disabled]){border-color:var(--accent);color:var(--accent);}
.grp-pager button[disabled]{opacity:.38;cursor:default;}
.grp-pager span{min-width:42px;text-align:center;}
.ng-count{color:#A6AEC0;font-weight:400;}
.stale-chip{color:#A8762B;background:#FAF3E3;}
.batch-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 6px 10px;font-size:14px;color:var(--muted);}
.batch-bar button{border:1px solid var(--border);background:#fff;border-radius:8px;padding:4px 11px;font-size:13.5px;color:var(--body);cursor:pointer;transition:.15s;}
.batch-bar button:hover{border-color:var(--accent);color:var(--accent);}
.done-actions{padding-top:12px;text-align:center;}
.note-item{padding:10px 11px;border-radius:10px;cursor:pointer;border:1px solid transparent;margin-bottom:2px;}
.note-item:hover{background:#F6F8FC;}
.note-item.active{background:var(--accent-weak);border-color:#D5E0FB;}
.note-item .ni-title{font-size:15.3px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.note-item .ni-title svg{width:12.5px;height:12.5px;color:var(--accent);flex-shrink:0;}
.note-item .ni-sub{font-size:13.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.note-item .ni-foot{font-size:12.5px;color:#A6AEC0;margin-top:4px;}

.note-edit-pane{padding:12px 32px 44px;height:100vh;overflow-y:auto;}
.editor-empty{height:70vh;display:grid;place-items:center;text-align:center;color:var(--muted);}
.editor-empty .ee{font-family:var(--serif);font-size:20.5px;color:var(--body);margin-bottom:8px;}
.editor-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:10px 0 6px;}
.title-input{
  flex:1;border:none;background:transparent;font-family:var(--serif);font-size:29px;font-weight:700;
  color:var(--ink);line-height:1.35;
}
.title-input::placeholder{color:#B6BECB;}
.save-state{font-size:13.5px;color:var(--muted);padding-top:12px;white-space:nowrap;transition:color .2s;}
.save-state.saving{color:var(--accent);}
.editor-toolbar{display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--divider);border-bottom:1px solid var(--divider);margin-bottom:14px;position:sticky;top:0;background:var(--bg);z-index:5;}
.tb-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--body);}
.tb-btn:hover{background:var(--accent-weak);color:var(--accent);}
.tb-btn svg{width:16px;height:16px;}
.tb-sep{width:1px;height:18px;background:var(--border);margin:0 5px;}
.tb-label{font-size:13.5px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:6px;}
.editor-body{
  min-height:340px;font-size:16.5px;line-height:1.85;color:var(--body);outline:none;padding:6px 2px;
}
.editor-body:empty::before{content:attr(data-ph);color:#B6BECB;}
.editor-body h1{font-family:var(--serif);font-size:24px;margin:16px 0 8px;}
.editor-body h2{font-family:var(--serif);font-size:20px;margin:14px 0 7px;}
.editor-body p{margin:6px 0;}
.editor-body ul,.editor-body ol{margin:6px 0 6px 22px;}
.editor-body ul{list-style:disc;}
.editor-body ol{list-style:decimal;}
.editor-body blockquote{
  border-left:3px solid var(--accent);background:var(--accent-weak);padding:8px 14px;border-radius:0 9px 9px 0;
  margin:10px 0;color:var(--body);
}
.editor-body img{max-width:100%;border-radius:10px;margin:8px 0;}
.editor-body b,.editor-body strong{color:var(--ink);font-weight:600;}
.tag-editor{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px dashed var(--border);}
.tag-chip2{display:inline-flex;align-items:center;gap:5px;background:var(--accent-weak);color:var(--accent);font-size:13.5px;border-radius:7px;padding:3px 6px 3px 10px;}
.tag-chip2 button{display:grid;place-items:center;color:var(--accent);opacity:.65;}
.tag-chip2 button:hover{opacity:1;}
.tag-chip2 svg{width:11px;height:11px;}
.tag-editor input{border:none;background:transparent;width:130px;font-size:14px;padding:4px 2px;}
.attach-strip{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px;}
.attach-file{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:7px 11px;font-size:14px;background:#FCFDFF;}
.attach-file svg{width:15px;height:15px;color:var(--accent);}
.attach-file .sz{color:var(--muted);font-size:13px;}
.editor-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}

/* ===== 日历 ===== */
.cal-wrap{display:grid;grid-template-columns:1.22fr 1fr;gap:20px;align-items:start;}
.cal-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:22px 26px;}
.cal-head{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;margin-bottom:8px;}
.cal-head .ym{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--ink);text-align:center;background:none;border:none;cursor:pointer;padding:4px;border-radius:8px;}
.cal-head .ym:hover{color:var(--accent);}
.cal-arrow{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted);border:none;background:transparent;cursor:pointer;}
.cal-arrow:hover{color:var(--accent);background:var(--divider);}
.cal-arrow svg{width:17px;height:17px;}
.week-row,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.week-row span{text-align:center;font-size:14px;color:var(--muted);padding:10px 0;font-weight:500;}
.cal-grid{gap:2px;}
.cell{
  min-height:76px;display:flex;flex-direction:column;align-items:center;padding-top:9px;gap:5px;
  cursor:pointer;border-radius:12px;transition:background .12s;
}
.cell:hover{background:#F4F6FB;}
.cell.other{cursor:default;pointer-events:none;}
.cell.other:hover{background:transparent;}
.cell .d{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;font-size:16.5px;color:var(--ink);font-weight:500;}
.cell.today .d{background:#EEF1FA;color:var(--accent);font-weight:700;}
.cell.selected .d{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 4px 10px rgba(52,80,197,.28);}
.cell.selected.today .d{color:#fff;}
.cal-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:-1px;}
.cal-dot.done{background:#A4ADC0;}
.cell.selected .cal-dot{background:#fff;}
.cell.other .cal-dot{opacity:.35;}
/* 右侧当日任务卡 */
.day-panel{padding:22px 24px;}
.dp-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.dp-ico{width:34px;height:34px;border-radius:10px;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;flex-shrink:0;}
.dp-ico svg{width:18px;height:18px;}
.dp-head h3{font-family:var(--serif);font-size:19.5px;font-weight:700;flex:1;margin:0;}
.dp-count{font-size:13.5px;color:var(--accent);background:var(--accent-weak);border-radius:20px;padding:3px 12px;font-weight:500;flex-shrink:0;}
.day-item{display:flex;gap:11px;padding:11px 2px;border-bottom:1px solid var(--divider);}
.day-item:last-child{border-bottom:none;}
.di-check{width:22px;height:22px;border-radius:50%;border:1.5px solid #C6CDDA;display:grid;place-items:center;color:#fff;flex-shrink:0;margin-top:1px;cursor:pointer;background:#fff;padding:0;transition:.15s;}
.di-check svg{width:12px;height:12px;}
.day-item.done .di-check{background:var(--accent);border-color:var(--accent);}
.di-body{flex:1;min-width:0;cursor:pointer;}
.di-title{font-size:15.5px;color:var(--ink);font-weight:500;line-height:1.45;word-break:break-all;}
.day-item.done .di-title{color:var(--muted);text-decoration:line-through;}
.di-meta{display:flex;align-items:center;gap:11px;margin-top:4px;font-size:13.5px;color:var(--muted);flex-wrap:wrap;}
.di-cat{display:inline-flex;align-items:center;gap:5px;}
.di-cat i{width:7px;height:7px;border-radius:50%;display:inline-block;}
.di-time{display:inline-flex;align-items:center;gap:4px;}
.di-time svg{width:12.5px;height:12.5px;}

/* ===== 回顾 ===== */
.rev-tabs{margin-bottom:18px;}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;text-align:center;}
.stat-card .n{font-family:var(--serif);font-size:35px;font-weight:700;color:var(--nav);line-height:1;}
.stat-card .l{font-size:14.5px;color:var(--muted);margin-top:8px;}
.stat-card.warn .n{color:var(--warn-ink);}
/* 回顾页：范围 tabs 与生成总结按钮同行，按钮与 tab 等高平齐 */
.rev-toolbar{display:flex;align-items:stretch;justify-content:space-between;gap:14px;margin-bottom:16px;}
.rev-toolbar .tabs{margin-bottom:0;}
.rev-toolbar .btn{display:inline-flex;align-items:center;gap:7px;}
/* 总结页 */
.sum-range-card{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.sum-range-card .tabs{margin-bottom:0;}
.sum-custom{display:inline-flex;align-items:center;gap:9px;font-size:15px;color:var(--muted);}
.sum-custom[hidden]{display:none;}
.sum-custom input[type=date]{border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:15px;color:var(--ink);background:#FCFDFF;font-family:inherit;}
.sum-prompt-tabs{display:inline-flex;align-items:center;gap:8px;}
.sp-tab{border:1px solid var(--border);background:#fff;border-radius:8px;padding:5px 12px;font-size:14px;color:var(--body);cursor:pointer;transition:.15s;}
.sp-tab:hover{border-color:var(--accent);color:var(--accent);}
.sp-tab.active{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:600;}
.sum-prompt{width:100%;min-height:118px;border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:15px;line-height:1.8;color:var(--body);background:#FCFDFF;resize:vertical;font-family:inherit;}
.sum-prompt:focus{outline:none;border-color:var(--accent);background:#fff;}
.sum-gen-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:12px;flex-wrap:wrap;}
.sum-gen-hint{font-size:13.5px;color:var(--muted);line-height:1.6;flex:1;min-width:220px;}
.sum-gen-btns{display:inline-flex;gap:10px;}
.sum-loading{text-align:center;color:var(--muted);font-size:15.5px;padding:26px;}
.sum-result{width:100%;min-height:240px;border:1px solid var(--border);border-radius:10px;padding:13px 15px;font-size:15.5px;line-height:2;color:var(--body);background:#FCFDFF;resize:vertical;font-family:inherit;}
.sum-result:focus{outline:none;border-color:var(--accent);background:#fff;}
.sum-save-row{display:flex;align-items:center;gap:14px;margin-top:12px;}
.sum-text{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:15.5px;line-height:2;color:var(--body);margin:0;font-weight:400;}
.sum-view-meta{font-size:14px;color:var(--muted);}
.sum-his-row{display:flex;align-items:center;gap:12px;padding:10px 4px;}
.sum-his-row+.sum-his-row{border-top:1px solid var(--divider);}
.sum-badge{flex-shrink:0;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-weak);border:1px solid #CFDAF6;border-radius:20px;padding:2px 10px;}
.sum-badge.plan{color:#247A52;background:#EAF7F0;border-color:#C4E4D2;}
.sh-main{flex:1;min-width:0;}
.sh-title{font-size:15.5px;color:var(--ink);font-weight:500;}
.sh-sub{font-size:13.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ai-set-row{display:flex;align-items:center;gap:12px;padding:8px 2px;}
.ai-set-row label{width:74px;flex-shrink:0;font-size:15px;color:var(--body);}
.ai-set-row input{flex:1;border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:14.5px;color:var(--ink);background:#FCFDFF;font-family:inherit;}
.ai-set-row input:focus{outline:none;border-color:var(--accent);background:#fff;}
.rev-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
.rev-item{display:flex;align-items:flex-start;gap:10px;padding:8px 4px;font-size:15.5px;color:var(--ink);}
.rev-item + .rev-item{border-top:1px solid var(--divider);}
.rev-mark{width:20px;height:20px;border-radius:50%;flex-shrink:0;margin-top:2px;display:grid;place-items:center;}
button.rev-mark{font:inherit;padding:0;background:#fff;cursor:pointer;transition:.15s;}
.rev-mark.ok{background:rgba(46,158,107,.12);color:var(--ok);}
.rev-mark.wait{border:1.6px solid #C3CAD8;}
.rev-mark.wait:hover{border-color:var(--accent);background:var(--accent-weak);box-shadow:0 0 0 3px rgba(52,80,197,.08);}
.rev-mark svg{width:11px;height:11px;}
.ch-count{font-size:14px;font-weight:400;color:var(--muted);margin-left:7px;}
.overdue-card .grp-pager{padding-top:8px;}
.overdue-card .grp-pager button{background:#FFF8EC;}
.rev-item .rt{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap;}

/* ===== 我的 ===== */
.me-groups{max-width:720px;}
.me-group{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;}
.me-group .mg-title{font-size:13.5px;color:var(--muted);letter-spacing:1px;padding:15px 20px 6px;font-weight:500;}
.me-row{display:flex;align-items:center;gap:13px;padding:13px 20px;width:100%;text-align:left;}
.me-row + .me-row{border-top:1px solid var(--divider);}
.me-row:hover{background:#FAFBFD;}
.me-row .mi{width:34px;height:34px;border-radius:10px;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;flex-shrink:0;}
.mi svg{width:17px;height:17px;}
.me-row .mt{flex:1;}
.me-row .mt .m1{font-size:15.5px;color:var(--ink);font-weight:500;}
.me-row .mt .m2{font-size:13.5px;color:var(--muted);margin-top:1px;}
.me-row .chev{color:#C3CAD8;}
.chev svg{width:16px;height:16px;}
.switch{width:42px;height:24px;border-radius:20px;background:#CFD6E2;position:relative;transition:background .18s;flex-shrink:0;}
.switch::after{content:"";position:absolute;top:2.5px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .18s;}
.switch.on{background:var(--accent);}
.switch.on::after{left:20px;}
.me-select{border:1px solid var(--border);border-radius:9px;padding:6px 9px;font-size:14.5px;background:#fff;color:var(--ink);}

/* ===== Modal / 抽屉 ===== */
/* 到点强提醒弹窗（网页内，前台醒目） */
.remind-layer{position:fixed;inset:0;background:rgba(23,32,51,.52);z-index:110;display:none;align-items:center;justify-content:center;padding:24px;animation:mf .18s ease;}
.remind-layer.show{display:flex;}
.remind-card{background:#fff;border-radius:20px;width:100%;max-width:446px;overflow:hidden;box-shadow:var(--shadow-pop);animation:mp .22s ease;border:1px solid var(--border);}
.remind-top{background:linear-gradient(135deg,var(--nav),var(--accent));padding:20px 24px 16px;color:#fff;display:flex;align-items:center;gap:13px;}
.remind-bell{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none;animation:ring 1.1s ease;}
.remind-bell svg{width:24px;height:24px;}
.remind-tag{font-size:12.5px;opacity:.86;letter-spacing:1.5px;}
.remind-kind{font-family:var(--serif);font-size:20px;font-weight:700;margin-top:3px;}
.remind-body{padding:20px 24px 6px;}
.remind-title{font-size:19px;font-weight:700;color:var(--ink);line-height:1.5;word-break:break-word;}
.remind-time{margin-top:10px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px;}
.remind-time svg{width:15px;height:15px;flex:none;}
.remind-more{margin-top:8px;font-size:13px;color:var(--accent);font-weight:500;}
.remind-actions{display:flex;gap:10px;padding:16px 24px 22px;}
.remind-actions button{flex:1;height:44px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--body);transition:.15s;}
.remind-actions button:hover{background:var(--bg);}
.remind-actions .r-primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:1.25;}
.remind-actions .r-primary:hover{background:var(--accent-h);}
@keyframes ring{0%{transform:rotate(0)}18%{transform:rotate(15deg)}36%{transform:rotate(-12deg)}54%{transform:rotate(8deg)}72%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
.modal-mask{
  position:fixed;inset:0;background:rgba(23,32,51,.42);z-index:80;display:none;align-items:center;justify-content:center;padding:24px;
  animation:mf .18s ease;
}
.modal-mask.show{display:flex;}
@keyframes mf{from{opacity:0;}to{opacity:1;}}
.modal{
  background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  box-shadow:var(--shadow-pop);animation:mp .2s ease;
}
@keyframes mp{from{transform:translateY(10px) scale(.985);opacity:.4;}to{transform:none;opacity:1;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 12px;position:sticky;top:0;background:#fff;z-index:2;}
.modal-head h3{font-family:var(--serif);font-size:19.5px;}
.icon-x{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted);}
.icon-x:hover{background:var(--divider);color:var(--ink);}
.icon-x svg{width:16px;height:16px;}
.modal-body{padding:4px 22px 22px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px;font-weight:500;}
.field input[type=text],.field input[type=date],.field input[type=datetime-local],.field select,.field textarea{
  width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:15.5px;background:#FCFDFF;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:#fff;}
/* 日期/时间输入：聚焦时各字段不出现蓝色选中样式，保持统一文字色 */
input[type=date]::-webkit-datetime-edit,
input[type=time]::-webkit-datetime-edit,
input[type=datetime-local]::-webkit-datetime-edit,
input[type=date]::-webkit-datetime-edit-year-field,
input[type=date]::-webkit-datetime-edit-month-field,
input[type=date]::-webkit-datetime-edit-day-field,
input[type=time]::-webkit-datetime-edit-hour-field,
input[type=time]::-webkit-datetime-edit-minute-field,
input[type=datetime-local]::-webkit-datetime-edit-year-field,
input[type=datetime-local]::-webkit-datetime-edit-month-field,
input[type=datetime-local]::-webkit-datetime-edit-day-field,
input[type=datetime-local]::-webkit-datetime-edit-hour-field,
input[type=datetime-local]::-webkit-datetime-edit-minute-field,
input[type=datetime-local]::-webkit-datetime-edit-ampm-field{color:inherit;background:none;padding:0;}
input[type=date]::-webkit-datetime-edit-year-field:focus,
input[type=date]::-webkit-datetime-edit-month-field:focus,
input[type=date]::-webkit-datetime-edit-day-field:focus,
input[type=time]::-webkit-datetime-edit-hour-field:focus,
input[type=time]::-webkit-datetime-edit-minute-field:focus,
input[type=datetime-local]::-webkit-datetime-edit-year-field:focus,
input[type=datetime-local]::-webkit-datetime-edit-month-field:focus,
input[type=datetime-local]::-webkit-datetime-edit-day-field:focus,
input[type=datetime-local]::-webkit-datetime-edit-hour-field:focus,
input[type=datetime-local]::-webkit-datetime-edit-minute-field:focus,
input[type=datetime-local]::-webkit-datetime-edit-ampm-field:focus{background:none;color:inherit;border-radius:0;}
.field textarea{resize:vertical;min-height:72px;line-height:1.7;}
.field-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.upload-zone{
  border:1.5px dashed var(--border);border-radius:11px;padding:13px;text-align:center;font-size:14px;color:var(--muted);cursor:pointer;
}
.upload-zone:hover{border-color:var(--accent);color:var(--accent);background:#FCFDFF;}
/* 事项弹窗（新建 / 详情）：左右双栏，参照设计稿 */
.todo-modal{max-width:940px;}
.cloud-modal{max-width:660px;}
.cl-steps{background:var(--bg);border:1px solid var(--divider);border-radius:11px;padding:13px 15px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px;}
.cl-step{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--body);line-height:1.55;}
.cl-step b{flex-shrink:0;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;margin-top:1px;}
.cl-sql{width:100%;min-height:150px;border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.7;color:var(--body);background:#FCFDFF;font-family:ui-monospace,Consolas,monospace;resize:vertical;}
.cl-login-box{background:var(--bg);border:1px solid var(--divider);border-radius:11px;padding:13px 15px;margin-bottom:14px;display:flex;flex-direction:column;gap:5px;}
.cl-login-box .field{margin-bottom:0;}
.cl-acc{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--ink);margin-bottom:2px;}
.cl-state{margin-top:6px;border-top:1px solid var(--divider);padding-top:13px;display:flex;flex-direction:column;gap:5px;}
.cl-state>div:first-child{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;color:var(--ink);}
.cl-dot{width:9px;height:9px;border-radius:50%;background:#C3CAD8;}
.cl-dot.on{background:#2E9E6B;box-shadow:0 0 0 3px rgba(46,158,107,.15);}
.cl-sub{font-size:13px;color:var(--muted);line-height:1.55;}
.todo-modal .modal-body{padding-top:0;}
.todo-modal .field{margin-bottom:13px;}
.todo-modal .field label{margin-bottom:6px;}
.form-grid{display:grid;grid-template-columns:1.06fr 1fr;gap:2px 26px;align-items:stretch;}
.form-col{min-width:0;display:flex;flex-direction:column;}
.form-col>:last-child{margin-bottom:0;}
.form-right{height:100%;}
.form-right textarea{flex:1;min-height:108px;line-height:1.7;}
.req{color:#C0564A;margin-left:2px;}
/* 快捷日期 */
.quick-dates{display:flex;gap:8px;margin-bottom:13px;flex-wrap:wrap;}
.qd-btn{border:1px solid var(--border);background:#fff;color:var(--body);border-radius:9px;padding:6px 15px;font-size:14.5px;cursor:pointer;transition:.15s;}
.qd-btn:hover{border-color:var(--accent);color:var(--accent);}
.qd-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-weak);font-weight:500;}
/* 截止时间 + 已完成（方框在上、文字在下） */
/* 类型 + 优先级 */
.type-pri{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;}
.cat-select-wrap{position:relative;}
.cat-select-wrap .cs-dot{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:9px;height:9px;border-radius:50%;pointer-events:none;}
.cat-select-wrap select{padding-left:28px;}
.pri-seg{display:inline-flex;gap:8px;}
.pri-seg button{border:1px solid var(--border);border-radius:9px;background:#fff;padding:8px 16px;font-size:14.5px;color:var(--body);cursor:pointer;transition:.15s;}
.pri-seg button:hover{border-color:var(--accent);color:var(--accent);}
.pri-seg button.active{background:var(--accent-weak);color:var(--accent);font-weight:600;border-color:var(--accent);}
/* 优先级行内徽章 */
.pri-badge{font-size:13px;padding:2px 8px;border-radius:20px;font-weight:500;border:1px solid transparent;}
.pri-badge.high{color:#C0564A;background:#FBEEEC;border-color:#EBC9C3;}
.pri-badge.low{color:var(--muted);background:#F1F3F7;border-color:var(--border);}
/* 拖拽上传 */
.picked-files{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.picked-files:empty{display:none;margin-bottom:0;}
.picked-files .attach-file{justify-content:space-between;border:1px solid var(--divider);background:#FAFBFD;padding:7px 11px;border-radius:9px;font-size:14px;}
.picked-files .pf-l{display:inline-flex;align-items:center;gap:7px;min-width:0;}
.picked-files .pf-l span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.drop-zone{border:1.5px dashed var(--border);border-radius:11px;padding:17px 14px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer;background:#FCFDFF;display:flex;flex-direction:column;align-items:center;gap:6px;line-height:1.5;transition:.15s;margin-bottom:0;}
.field label.drop-zone{display:flex;flex-direction:column;align-items:center;margin-bottom:0;}
.drop-zone:hover{border-color:var(--accent);color:var(--accent);}
.drop-zone.drag{border-color:var(--accent);background:var(--accent-weak);color:var(--accent);}
.drop-zone svg{width:22px;height:22px;}
.drop-zone .dz-sub{font-size:12.5px;opacity:.8;}
.attach-mini{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.attach-mini .attach-file{padding:5px 9px;font-size:13.5px;border-radius:9px;gap:6px;}
.attach-mini .attach-file svg{width:13px;height:13px;}
.attach-add{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--border);border-radius:9px;padding:5px 11px;font-size:13.5px;color:var(--muted);cursor:pointer;background:#FCFDFF;}
.attach-add:hover{border-color:var(--accent);color:var(--accent);}
.attach-add svg{width:13px;height:13px;}
@media(max-width:680px){
  .todo-modal{max-width:100%;}
  .form-grid{grid-template-columns:1fr;}
  .form-right textarea{min-height:130px;}
}
/* 类型管理 */
.cat-mrow{display:flex;align-items:center;gap:9px;padding:9px 4px;border-bottom:1px solid var(--divider);background:#fff;border-radius:10px;}
.cat-mrow:last-child{border-bottom:none;}
.cat-mrow.dragging{opacity:.92;background:#EEF1FB;box-shadow:0 6px 18px rgba(23,32,51,.16);border-bottom-color:transparent;}
.cat-grip{color:#C3CAD8;cursor:grab;display:grid;place-items:center;width:20px;flex-shrink:0;touch-action:none;user-select:none;}
.cat-grip:hover{color:var(--accent);}
.cat-grip:active{cursor:grabbing;}
.cat-grip svg{width:15px;height:15px;pointer-events:none;}
.cat-mrow input{flex:1;border:1px solid var(--border);border-radius:9px;padding:7px 11px;font-size:15px;color:var(--ink);background:#FCFDFF;}
.cat-mrow input:focus{border-color:var(--accent);background:#fff;}
.cat-mbtn{width:31px;height:31px;border-radius:8px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--border);background:#fff;}
.cat-mbtn:hover{color:var(--accent);border-color:var(--accent);}
.cat-mbtn.del:hover{color:#B5453B;border-color:#B5453B;}
.cat-mbtn svg{width:14px;height:14px;}
.modal-foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;}
.modal-foot .mf-l{display:flex;gap:9px;}
.modal-foot .mf-r{display:flex;gap:9px;}

/* Toast */
.toast-root{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{
  background:var(--ink);color:#fff;font-size:14.5px;padding:9px 18px;border-radius:22px;box-shadow:var(--shadow-pop);
  animation:tin .22s ease;max-width:80vw;
}
@keyframes tin{from{transform:translateY(8px);opacity:0;}to{transform:none;opacity:1;}}

/* ===== 手机底栏 ===== */
.tabbar{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--border);
  grid-template-columns:repeat(4,1fr);padding:4px 0 calc(4px + env(safe-area-inset-bottom));
}
.tb-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;font-size:12.5px;color:var(--muted);}
.tb-item svg{width:21px;height:21px;}
.tb-item.active{color:var(--accent);font-weight:600;}
.mobile-top{display:none;}

/* ============================================================
   响应式：≤ 860px 走手机形态
   ============================================================ */
@media (max-width:860px){
  .sidebar{display:none;}
  .main{margin-left:0;}
  .view{padding:14px 15px 86px;max-width:100%;}
  .view[data-view=todos],.view[data-view=home]{max-width:100%;margin:0 auto;}
  .mobile-top{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;background:var(--nav);color:#fff;position:sticky;top:0;z-index:30;
  }
  .mobile-top .mn{font-family:var(--serif);font-size:20.5px;font-weight:700;letter-spacing:2px;}
  .mobile-top .mnew{display:flex;gap:8px;}
  .mnew button{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff;}
  .mnew svg{width:17px;height:17px;}
  .tabbar{display:grid;}
  .page-head h1{font-size:24px;}
  .grid-2{grid-template-columns:1fr;}
  .grid-2 .card:last-child{margin-bottom:0;}
  .cal-wrap{grid-template-columns:1fr;}
  .stat-row{grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .stat-card{padding:14px 8px;}
  .rev-toolbar{flex-direction:column;align-items:stretch;}
  .sum-gen-btns{width:100%;}
  .sum-gen-btns .btn{flex:1;}
  .stat-card .n{font-size:24px;}
  .rev-cols{grid-template-columns:1fr;}
  .head-actions .btn-ghost span.txt{display:none;}
  /* 笔记：列表/编辑单栏切换 */
  .view.notes-view{padding:0 0 70px;height:auto;display:none;}
  .view.notes-view.active{display:block;}
  .notes-wrap{grid-template-columns:1fr;margin:0;}
  .note-list-pane{height:auto;border-right:none;}
  .note-edit-pane{height:auto;display:none;}
  .notes-wrap.editing .note-list-pane{display:none;}
  .notes-wrap.editing .note-edit-pane{display:block;}
  .cell{min-height:54px;padding-top:6px;gap:3px;}
  .cell .d{width:32px;height:32px;font-size:15px;border-radius:9px;}
  .cal-panel{padding:16px 14px;}
  .modal-mask{padding:0;align-items:flex-end;}
  .modal{max-width:100%;border-radius:18px 18px 0 0;max-height:92vh;}
  .field-2,.field-3{grid-template-columns:1fr;}
  .fp-stats{gap:18px;}
  .quick-note{min-height:0;}
}
.brand{text-align:center;}
.nav-item{position:relative;justify-content:center;padding-left:42px;padding-right:42px;text-align:center;}
.nav-item svg{position:absolute;left:calc(50% - 48px);}
.sidebar-foot{justify-content:center;text-align:center;flex-wrap:wrap;}
.modal > .modal-foot{padding:0 22px 20px;flex-wrap:wrap;}
.modal-body p{margin:0 0 10px;}
.check-row{display:flex;gap:8px;align-items:center;margin:7px 0}.check-row input[type=text]{min-width:0;flex:1}.check-row input[type=checkbox],.weekly-item input{width:18px!important;flex:none}.check-progress{display:flex;gap:8px;align-items:center;color:var(--muted)}.check-progress progress{width:90px;height:8px}.weekly-item{display:flex;gap:10px;align-items:center;margin:12px 0;overflow-wrap:anywhere}.modal-body h4{margin:16px 0 8px}.pf-l{flex-wrap:wrap}.modal-body{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="app">
  <!-- ===== 侧边导航（桌面） ===== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="name">知行记</div>
      <div class="slogan">工作与生活</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <span class="seal">知行合一</span>
      <small><span>需要记时马上记</span><span>需要做时看得到</span></small>
    </div>
  </aside>

  <main class="main">
    <div class="mobile-top">
      <div class="mn">知行记</div>
      <div class="mnew">
        <button id="m-new-todo" aria-label="新建待办"></button>
        <button id="m-new-note" aria-label="新建笔记"></button>
      </div>
    </div>

    <!-- ===== 视图：首页 ===== -->
    <section class="view" data-view="home" id="view-home"></section>
    <!-- ===== 视图：待办 ===== -->
    <section class="view" data-view="todos" id="view-todos"></section>
    <!-- ===== 视图：笔记 ===== -->
    <section class="view notes-view" data-view="notes" id="view-notes"></section>
    <!-- ===== 视图：日历 ===== -->
    <section class="view" data-view="calendar" id="view-calendar"></section>
    <!-- ===== 视图：回顾 ===== -->
    <section class="view" data-view="review" id="view-review"></section>

    <section class="view" data-view="summary" id="view-summary"></section>
    <!-- ===== 视图：我的 ===== -->
    <section class="view" data-view="me" id="view-me"></section>
    <!-- ===== 视图：回收站 ===== -->
    <section class="view" data-view="trash" id="view-trash"></section>
  </main>
</div>

<!-- ===== 手机底栏 ===== -->
<nav class="tabbar" id="tabbar"></nav>
<div class="modal-mask" id="modalMask"></div>
<div class="remind-layer" id="remindLayer"></div>
<div class="toast-root" id="toastRoot"></div>

<script>
// Attachment transfer state is device-local; only confirmed object references sync.
const attachmentTransfers=new Map();
let attachmentScanBusy=false;
function attachmentStatus(a){const s=attachmentTransfers.get(a.id);return s?.busy?'上传中':s?.error?'仅本机 · 上传失败':a.cloudFile?'已同步':'仅本机';}
function attachmentLink(a){return a.id?`<button class="btn-text" data-act="download-attachment" data-file="${esc(a.id)}">${esc(a.name)}</button><small data-file-status="${esc(a.id)}">${attachmentStatus(a)}</small><button class="btn-text" data-act="upload-attachment" data-file="${esc(a.id)}">${a.cloudFile?'检查同步':'上传 / 重试'}</button>`:`<span>${esc(a.name)} <small>仅文件名，需重新添加原文件</small></span>`;}
function refreshAttachmentStatus(){document.querySelectorAll('[data-file-status]').forEach(el=>{const a=allAttachments().find(a=>a.id===el.dataset.fileStatus);if(a){el.textContent=attachmentStatus(a);el.title=attachmentTransfers.get(a.id)?.error||'';}});}
async function attachmentContext(){const c=loadCloud(),epoch=cloudEpoch;if(storageBlocked||!c.enabled||!c.session||!c.bound||c.lastUid!==c.session.uid||c.status==='conflict')throw Error('请先登录并完成账号数据同步，处理版本冲突');if(!await ensureToken()||!cloudSessionMatches(c,epoch))throw Error('登录已变化，请重试');return {c:loadCloud(),epoch};}
function storageObjectURL(c,path,download=false){return cloudBase(c)+'/storage/v1/object/'+(download?'authenticated/':'')+'zxj-files/'+path.split('/').map(encodeURIComponent).join('/');}
async function uploadAttachment(id,manual=true){
  if(attachmentTransfers.get(id)?.busy)return;
  const a=allAttachments().find(a=>a.id===id);if(!a)return;
  attachmentTransfers.set(id,{busy:true});refreshAttachmentStatus();fileJobs++;
  try{
    const {c,epoch}=await attachmentContext();
    if(a.cloudFile){if(a.cloudFile.owner!==c.session.uid||a.cloudFile.base!==cloudBase(c))throw Error('原文件属于其他账号或存储项目');if(manual)toast('原文件已上传；附件清单随账号数据同步');return;}
    const blob=await blobGet(id);if(!blob)throw Error('此设备没有原文件，请在最初添加文件的设备上传');
    if(blob.size>20*1048576)throw Error('文件超过 20MB');
    const path=c.session.uid+'/'+uid();
    await cloudFetch(storageObjectURL(c,path),{method:'POST',headers:{...cloudHeaders(c),'Content-Type':blob.type||'application/octet-stream','x-upsert':'false'},body:blob});
    if(!cloudSessionMatches(c,epoch)||!allAttachments().includes(a)||storageBlocked)throw Error('账号或附件已变化，上传结果未关联，请重试');
    for(const ref of allAttachments().filter(x=>x.id===id)){ref.cloudFile={base:cloudBase(c),owner:c.session.uid,path};ref.localOnly=false;}persist();
    attachmentTransfers.delete(id);if(manual)toast('原文件已上传，正在同步附件清单');
  }catch(e){attachmentTransfers.set(id,{error:e.message+'。若提示 HTTP 400/403/404，请先执行附件存储初始化 SQL。'});if(manual)toast(attachmentTransfers.get(id).error);}
  finally{fileJobs--;const s=attachmentTransfers.get(id);if(s?.busy)attachmentTransfers.delete(id);refreshAttachmentStatus();}
}
async function syncAttachments(){if(attachmentScanBusy||storageBlocked)return;const c=loadCloud();if(!c.enabled||!c.bound||!c.session||c.lastUid!==c.session.uid||c.status==='conflict')return;attachmentScanBusy=true;try{for(const a of [...new Map(allAttachments().filter(a=>a.id).map(a=>[a.id,a])).values()])if(!a.cloudFile&&!attachmentTransfers.has(a.id))await uploadAttachment(a.id,false);}finally{attachmentScanBusy=false;}}
async function downloadAttachment(id){try{const a=allAttachments().concat(ui.ntFiles||[],ui.quickFiles||[]).find(a=>a.id===id);if(!a)return;let blob=await blobGet(id);if(!blob&&a.cloudFile){const {c,epoch}=await attachmentContext();if(a.cloudFile.owner!==c.session.uid||a.cloudFile.base!==cloudBase(c)||!a.cloudFile.path.startsWith(c.session.uid+'/'))throw Error('请登录原文件所属账号和项目');toast('正在下载原文件');const r=await cloudFetch(storageObjectURL(c,a.cloudFile.path,true),{headers:cloudHeaders(c)});blob=await r.blob();if(!cloudSessionMatches(c,epoch))throw Error('账号已切换，已取消下载');if(blob.size>20*1048576)throw Error('文件超过 20MB');try{await blobPut(id,blob);}catch(e){toast('本机缓存空间不足，仍可下载文件');}}if(!blob)throw Error('仅本机附件：请在原设备上传后再同步');downloadBlob(a.name,blob);}catch(e){toast('附件下载失败：'+e.message);}}
function attachmentPanel(){flushEditor();$('#modalMask').innerHTML=`<div class="modal"><div class="modal-head"><h3>附件跨设备同步</h3><button data-act="close-modal">关闭</button></div><div class="modal-body"><p>同一账号登录后，原文件上传到私有存储。首次使用请在 Supabase SQL 编辑器执行初始化脚本，再点击上传。本机没有原文件的旧附件需在原设备上传。</p><a href="./知行记-附件存储.sql" download>下载附件存储初始化 SQL</a><p>上传后还需完成账号数据同步，其他设备才能看到附件。移除附件不会立即清除云文件，避免影响其他引用及备份。</p>${allAttachments().filter((a,i,arr)=>arr.findIndex(x=>x.id===a.id)===i).map(a=>`<p>${attachmentLink(a)}</p>`).join('')||'<p>暂无附件</p>'}</div></div>`;$('#modalMask').classList.add('show');}
function checklistProgress(t){const a=t.checklist||[];return a.length?`<small class="check-progress">步骤 ${a.filter(x=>x.done).length}/${a.length}<progress max="${a.length}" value="${a.filter(x=>x.done).length}" aria-label="子任务完成进度"></progress></small>`:'';}
function checklistRow(x={}){return `<div class="check-row"><input type="checkbox" aria-label="步骤完成" ${x.done?'checked':''}><input type="text" maxlength="300" aria-label="步骤名称" value="${esc(x.title||'')}" placeholder="输入一个步骤"><button type="button" data-check-remove aria-label="删除步骤">×</button></div>`;}
function checklistEditor(t){return `<div class="field"><label>子任务与检查清单</label><div id="checklist-rows">${(t.checklist||[]).map(checklistRow).join('')}</div><button type="button" data-check-add>＋ 添加步骤</button> <button type="button" data-check-paper>添加论文步骤</button><p class="cl-sub">勾选保存后更新进度；完成全部步骤后可手动完成事项。</p></div>`;}
function readChecklist(){return [...document.querySelectorAll('#checklist-rows .check-row')].map(el=>({title:el.querySelector('input[type=text]').value.trim(),done:el.querySelector('input[type=checkbox]').checked})).filter(x=>x.title);}
function weekBounds(day){const n=(pdate(day).getDay()+6)%7,start=addDays(day,-n);return [start,addDays(start,6)];}
function beijingDate(stamp){return Number.isFinite(stamp)?new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date(stamp)):'';}
function weeklyData(day){const [start,end]=weekBounds(day),inside=d=>d>=start&&d<=end;return {start,end,next:addDays(start,7),done:DB.todos.filter(t=>t.done&&inside(beijingDate(t.doneAt))),delayed:DB.todos.filter(t=>(!t.done&&t.date&&t.date<=end&&t.date<businessToday())||(t.dateChanges||[]).some(x=>inside(beijingDate(x.at))&&x.to>x.from)),notes:DB.notes.filter(n=>inside(beijingDate(n.createdAt)))};}
function openWeekly(day=businessToday()){
  flushEditor();const w=weeklyData(day);const item=(r,type)=>`<label class="weekly-item"><input type="checkbox" data-week-type="${type}" value="${esc(r.id)}"><span>${esc(r.title||'无标题')}${type==='todo'&&r.done?'（已完成，可建立后续事项）':''}</span></label>`;
  $('#modalMask').innerHTML=`<div class="modal"><div class="modal-head"><h3>每周回顾与下周安排</h3><button data-act="close-modal">关闭</button></div><div class="modal-body"><label>选择回顾周内任意一天 <input type="date" id="weekly-day" value="${w.start}"></label><p>${w.start} ～ ${w.end}</p><h4>完成事项（${w.done.length}）</h4>${w.done.map(t=>item(t,'todo')).join('')||'<p>暂无</p>'}<h4>延期事项（${w.delayed.length}）</h4><p>包含当前逾期事项及本周记录的向后改期；旧版本改期历史无法追溯。</p>${w.delayed.map(t=>item(t,'todo')).join('')||'<p>暂无</p>'}<h4>新增笔记（${w.notes.length}）</h4>${w.notes.map(n=>item(n,'note')).join('')||'<p>暂无</p>'}<label>安排到下周 <input type="date" id="weekly-target" min="${w.next}" max="${addDays(w.next,6)}" value="${w.next}"></label><p>未完成事项移到所选日期；已完成事项与笔记生成后续待办。同一来源同一周不会重复生成。新事项不自动设置提醒。</p><button class="btn btn-primary" id="weekly-generate">将勾选内容安排到下周</button></div></div>`;
  $('#modalMask').classList.add('show');$('#weekly-day').onchange=e=>{if(e.target.value)openWeekly(e.target.value);};$('#weekly-generate').onclick=()=>generateWeekly(w);
}
function recordDateChange(t,from,to){if(from&&to&&to>from)(t.dateChanges||(t.dateChanges=[])).push({from,to,at:Date.now()});}
function generateWeekly(w){
  if(storageBlocked){toast('请先恢复数据保存');return;}const target=$('#weekly-target').value;if(target<w.next||target>addDays(w.next,6)){toast('请选择下周范围内的日期');return;}
  const selected=[...document.querySelectorAll('[data-week-type]:checked')],seen=new Set();let count=0;

function sanitizeHtml(value){
  const src=document.createElement('template');src.innerHTML=String(value||'');
  const allowed=new Set('P DIV SPAN BR B STRONG I EM U S BLOCKQUOTE H1 H2 H3 H4 UL OL LI PRE CODE TABLE THEAD TBODY TR TH TD HR A IMG'.split(' '));
  const blocked=new Set('SCRIPT STYLE IFRAME OBJECT EMBED SVG MATH FORM INPUT BUTTON TEXTAREA SELECT LINK META BASE'.split(' '));
  function clean(node){
    if(node.nodeType===3)return document.createTextNode(node.textContent);
    const fragment=document.createDocumentFragment();if(node.nodeType!==1||blocked.has(node.tagName))return fragment;
    if(!allowed.has(node.tagName)){for(const ch of node.childNodes)fragment.append(clean(ch));return fragment;}
    const out=document.createElement(node.tagName.toLowerCase());
    if(node.tagName==='A'){const href=node.getAttribute('href')||'';if(/^(https?:\/\/|mailto:)/i.test(href.trim())){out.setAttribute('href',href);out.setAttribute('rel','noopener noreferrer');out.setAttribute('target','_blank');}}
    if(node.tagName==='IMG'){
      const src=node.getAttribute('src')||'';
      if(!/^data:image\/(png|jpeg|gif|webp);base64,[a-z0-9+/=\s]+$/i.test(src))return fragment;
      out.setAttribute('src',src);out.setAttribute('alt',node.getAttribute('alt')||'');out.style.maxWidth='100%';
    }
    for(const ch of node.childNodes)out.append(clean(ch));return out;
  }
  const dst=document.createElement('div');for(const ch of src.content.childNodes)dst.append(clean(ch));return dst.innerHTML;
}
function validateData(d){
  for(const key of ['todos','notes','categories','summaries'])if(d[key]!==undefined&&!Array.isArray(d[key]))throw Error(key+' 必须是数组');
  const validId=id=>typeof id==='string'&&/^[a-zA-Z0-9_-]{1,128}$/.test(id);
  for(const key of ['todos','notes','categories','summaries']){
    const seen=new Set();for(const r of d[key]||[]){if(!r||typeof r!=='object'||!validId(r.id)||seen.has(r.id))throw Error(key+' 包含无效或重复 ID');seen.add(r.id);
      for(const k of ['title','content','note','name','date','time','reminder','cat'])if(r[k]!=null&&typeof r[k]!=='string')throw Error(k+' 字段格式错误');
      if(r.tags!==undefined&&(!Array.isArray(r.tags)||r.tags.some(t=>typeof t!=='string')))throw Error('标签格式错误');
      if(r.attachments!==undefined&&(!Array.isArray(r.attachments)||r.attachments.some(a=>!a||typeof a.name!=='string'||(a.id&&!validId(a.id)))))throw Error('附件格式错误');
      if(r.checklist!==undefined&&(!Array.isArray(r.checklist)||r.checklist.some(x=>!x||typeof x.title!=='string'||typeof x.done!=='boolean')))throw Error('检查清单格式错误');
      if(r.dateChanges!==undefined&&(!Array.isArray(r.dateChanges)||r.dateChanges.some(x=>!x||!Number.isFinite(x.at)||typeof x.from!=='string'||typeof x.to!=='string')))throw Error('改期历史格式错误');
      for(const a of r.attachments||[])if(a.cloudFile){const f=a.cloudFile;if(typeof f.base!=='string'||typeof f.owner!=='string'||typeof f.path!=='string'||!/^https:\/\//.test(f.base)||!validId(f.owner)||!new RegExp('^'+f.owner+'/[a-zA-Z0-9_-]{1,128}$').test(f.path))throw Error('云附件引用格式错误');}
      if(r.date!=null&&r.date!==''&&!/^\d{4}-\d{2}-\d{2}$/.test(r.date))throw Error('事项日期格式错误');
      if(r.time!=null&&r.time!==''&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(r.time))throw Error('事项时间格式错误');
      if(r.reminder!=null&&r.reminder!==''&&!/^\d{4}-\d{2}-\d{2}[ T]([01]\d|2[0-3]):[0-5]\d$/.test(r.reminder))throw Error('提醒时间格式错误');
      if(r.priority&&!['high','mid','low'].includes(r.priority))throw Error('优先级格式错误');
      if(r.range&&(!Array.isArray(r.range)||r.range.length!==2||r.range.some(x=>typeof x!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(x))))throw Error('总结范围格式错误');
      if(key==='notes'&&r.content)r.content=sanitizeHtml(r.content);
    }
  }
  if(d.trash){if(typeof d.trash!=='object'||Array.isArray(d.trash))throw Error('回收站格式错误');for(const key of ['todos','notes'])if(d.trash[key]!==undefined){if(!Array.isArray(d.trash[key]))throw Error('回收站必须是数组');for(const x of d.trash[key]){if(!x?.item||!Number.isFinite(x.deletedAt))throw Error('回收站记录损坏');validateData({[key]:[x.item]});}}}
  if(d.settings){if(typeof d.settings!=='object'||Array.isArray(d.settings))throw Error('设置格式错误');if(d.settings.ai&&(typeof d.settings.ai!=='object'||Array.isArray(d.settings.ai)))throw Error('AI 设置格式错误');}
}

const pad=n=>String(n).padStart(2,'0');

function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pdate(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
let T=businessToday();
function addDays(s,n){const d=pdate(s);d.setDate(d.getDate()+n);return dstr(d);}
function addMonth(s,n){const d=pdate(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return dstr(d);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function stripHtml(html){const d=document.createElement('template');d.innerHTML=sanitizeHtml(html);return (d.content.textContent||'').replace(/\u00a0/g,' ').trim();}
function fmtSize(b){if(b==null)return '';if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(1)+' MB';}
function hm(r){return r?r.slice(11):'';}
const WEEKC=['周日','周一','周二','周三','周四','周五','周六'];
function fmtCN(s){const d=pdate(s);return (d.getMonth()+1)+'月'+d.getDate()+'日';}
function relDay(s){
  if(s===T)return '今天';
  if(s===addDays(T,1))return '明天';
  if(s===addDays(T,-1))return '昨天';
  const diff=Math.round((pdate(s)-pdate(T))/86400000);
  if(diff>1&&diff<7)return WEEKC[pdate(s).getDay()];
  return fmtCN(s);
}
function fmtTime(ts){
  if(!ts)return '';
  const d=new Date(ts),s=dstr(d);
  if(s===T)return pad(d.getHours())+':'+pad(d.getMinutes());
  return fmtCN(s);
}
function debounce(fn,ms){let t,args;const f=(...a)=>{args=a;clearTimeout(t);t=setTimeout(()=>{t=null;fn(...args);},ms);};f.cancel=()=>{clearTimeout(t);t=null;};f.flush=()=>{if(t){f.cancel();fn(...args);}};return f;}

function migrate(d){
  if(!d||typeof d!=='object'||Array.isArray(d))throw Error('数据格式不是对象');
  validateData(d);
  if(!d.categories||!d.categories.length)d.categories=defaultCategories();
  if(!Array.isArray(d.todos))d.todos=[];
  if(!Array.isArray(d.notes))d.notes=[];
  if(!d.trash||typeof d.trash!=='object')d.trash={todos:[],notes:[]};
  if(!Array.isArray(d.trash.todos))d.trash.todos=[];
  if(!Array.isArray(d.trash.notes))d.trash.notes=[];
  const valid=new Set(d.categories.map(c=>c.id));
  const fallback=d.categories[0].id;
  (d.todos||[]).forEach(t=>{
    if(!valid.has(t.cat))t.cat=fallback;
    if(!t.attachments)t.attachments=[];
    // 旧版本“计划时间”寄存在 reminder 中：迁移为独立 time 字段，reminder 回归提醒语义
    if(t.time===undefined){
      if(t.reminder&&/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(t.reminder)){t.time=t.reminder.slice(11,16);t.reminder=null;}
      else t.time=null;
    }
    if(!t.priority)t.priority='mid';
    if(!t.tags)t.tags=[];
    if(typeof t.done!=='boolean')t.done=false;
    if(t.doneAt===undefined)t.doneAt=null;
    if(!t.repeat)t.repeat='none';
    if(t.linkedNoteId===undefined)t.linkedNoteId=null;
  });
  (d.notes||[]).forEach(n=>{
    if(!valid.has(n.cat)){
      const hit=d.categories.find(c=>(n.tags||[]).some(t=>t.includes(c.name)));
      n.cat=hit?hit.id:fallback;
    }
    if(!n.attachments)n.attachments=[];
    if(!n.tags)n.tags=[];
    if(typeof n.pinned!=='boolean')n.pinned=false;
    if(!n.content)n.content='';
  });
  if(!Array.isArray(d.summaries))d.summaries=[];

  if(st.mail.publicKey==='vEp5AY66dc2Lx8xU')st.mail.publicKey=PM.publicKey; // 一次性纠正历史错误公钥
  if(typeof st.mail.to!=='string')st.mail.to='';

function load(){

    d.trash.todos=d.trash.todos.filter(x=>x.deletedAt>cut);d.trash.notes=d.trash.notes.filter(x=>x.deletedAt>cut);

}

  if(storageBlocked){showStorageError('原始数据无法读取，已阻止覆盖。请导出原始数据并从备份恢复。');return false;}
  if(touch&&!applyingRemote)DB._rev=Math.max(Date.now(),(DB._rev||0)+1);

  catch(e){showStorageError('保存失败：'+e.message+'。当前修改仍在内存，请立即导出备份。');return false;}

}

function sortTodos(arr){

    if(ka!==kb)return ka<kb?-1:1;

function todoRow(t,opt){

  let meta=[];
  if(!opt.hideCat)meta.push(`<span class="tag-chip cat-name">${catDot(t.cat)}${esc(catName(t.cat))}</span>`);
  if(t.date&&!opt.hideDate)meta.push(`<span class="tag-chip">${I.cal}${relDay(t.date)}</span>`);
  if(t.reminder)meta.push(`<span class="tag-chip">${I.clock}提醒 ${hm(t.reminder)}</span>`);
  if(t.repeat&&t.repeat!=='none')meta.push(`<span class="tag-chip">${I.repeat}${repeatLabel(t.repeat)}</span>`);
  (t.tags||[]).forEach(tg=>meta.push(`<span class="tag-chip tag-hash">#${esc(tg)}</span>`));
  if(t.attachments.length)meta.push(`<span class="tag-chip">${I.attach}${t.attachments.length} 个附件</span>`);
  if(!t.date&&t.createdAt&&Date.now()-t.createdAt>14*864e5)meta.push(`<span class="stale-chip">搁置 ${Math.floor((Date.now()-t.createdAt)/864e5)} 天</span>`);
  const over=st==='overdue';
  return `<li class="todo-row ${t.done?'is-done':''}">

/* ============================================================
   八、视图：待办
   ============================================================ */
const PAGE_SIZE=10;
/* 组内分页器：超过 10 条时分页 */
function pager(key,total,size){
  size=size||PAGE_SIZE;
  const pages=Math.ceil(total/size);
  if(pages<=1)return '';
  let p=ui.groupPage[key]||0;
  if(p>=pages)p=pages-1;if(p<0)p=0;
  return `<div class="grp-pager">
    <button type="button" ${p===0?'disabled':''} data-act="page-group" data-key="${key}" data-p="${p-1}" aria-label="上一页">${I.chevL}</button>
    <span>${p+1} / ${pages}</span>
    <button type="button" ${p===pages-1?'disabled':''} data-act="page-group" data-key="${key}" data-p="${p+1}" aria-label="下一页">${I.chevR}</button>
  </div>`;
}
/* 取某组当前页切片 + 分页器（可自定义每页条数） */
function pagedSlice(key,items,size){
  size=size||PAGE_SIZE;
  const pages=Math.max(1,Math.ceil(items.length/size));
  let p=ui.groupPage[key]||0;if(p>=pages)p=pages-1;if(p<0)p=0;
  return {rows:items.slice(p*size,(p+1)*size),pager:pager(key,items.length,size)};
}
function sortTodoList(arr){
  const a=arr.slice();
  if(ui.todoSort==='priority')return a.sort((x,y)=>{
    const p=(PRI_W[x.priority]??1)-(PRI_W[y.priority]??1);
    if(p)return p;
    const kx=(x.date||'9999-99-99')+' '+(x.time||'99:99'),ky=(y.date||'9999-99-99')+' '+(y.time||'99:99');
    return kx<ky?-1:kx>ky?1:x.createdAt-y.createdAt;
  });
  if(ui.todoSort==='created')return a.sort((x,y)=>y.createdAt-x.createdAt);
  return sortTodos(a);
}
function matchTodoQ(t){
  const q=(ui.todoQuery||'').trim().toLowerCase();
  if(!q)return true;
  return (t.title+' '+(t.note||'')+' '+(t.tags||[]).join(' ')).toLowerCase().includes(q);
}
/* 分组标题：chevron=true 时点击可整体折叠 */
function grpHead(key,text,count,chevron,defOpen){
  const open=ui.groupOpen[key]??(defOpen===false?false:true);
  return `<button type="button" class="grp-head ${chevron?'':'is-static'}" ${chevron?`data-act="toggle-group" data-key="${key}"`:''}>
    <span class="gh-l">${chevron?`<span class="gh-c ${open?'open':''}">${I.chevR}</span>`:''}${text}</span>
    <span class="gh-n">${count}</span></button>`;
}
/* 组体：每页 10 条分页；整体折叠时不渲染 */
function grpBody(key,items,rowFn,sortFn,defOpen){
  const st=ui.groupOpen[key]??(defOpen===false?false:true);
  if(st===false)return '';
  const rows=sortFn?sortFn(items):sortTodoList(items);
  const pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));
  let p=ui.groupPage[key]||0;if(p>=pages)p=pages-1;if(p<0)p=0;
  const body=rows.slice(p*PAGE_SIZE,(p+1)*PAGE_SIZE).map(t=>rowFn(t)).join('');
  return `<div class="todo-lines">${body}</div>${pager(key,rows.length)}`;
}
function doneRow(t){
  return `<li class="todo-row is-done">
    <button class="check" data-act="toggle-todo" data-id="${t.id}">${OKMARK}</button>
    <div class="todo-main" data-act="open-todo" data-id="${t.id}">
      <div class="todo-title">${esc(t.title)}</div>${checklistProgress(t)}
      <div class="todo-meta">${t.date?`<span class="tag-chip">${I.cal}${relDay(t.date)}</span>`:''}<span class="tag-chip">完成于 ${fmtTime(t.doneAt)}</span></div>
    </div><div class="todo-side">${todoMenu(t)}</div>
  </li>`;
}
function renderTodos(){
  const tab=ui.todoTab;
  const catOk=t=>ui.todoCat==='all'||t.cat===ui.todoCat;
  const q=(ui.todoQuery||'').trim();
  const groups={
    today:DB.todos.filter(t=>!t.done&&t.date===T&&tState(t)!=='overdue'&&catOk(t)),
    upcoming:DB.todos.filter(t=>!t.done&&t.date&&t.date>T&&catOk(t)),
    unscheduled:DB.todos.filter(t=>!t.done&&!t.date&&catOk(t)),
    done:DB.todos.filter(t=>t.done&&catOk(t)).sort((a,b)=>b.doneAt-a.doneAt)
  };
  const overdue=DB.todos.filter(t=>tState(t)==='overdue'&&catOk(t));
  const cnt={today:groups.today.length,upcoming:groups.upcoming.length,unscheduled:groups.unscheduled.length,done:groups.done.length};
  const TABS=[['today','今天'],['upcoming','近期'],['unscheduled','待安排'],['done','已完成']];
  const byCreatedDesc=a=>a.slice().sort((x,y)=>y.createdAt-x.createdAt);
  const byDoneDesc=a=>a.slice().sort((x,y)=>(y.doneAt||0)-(x.doneAt||0));
  let listHtml='';
  if(q){
    // 跨 Tab 搜索：未完成 + 已完成两段
    const hit=DB.todos.filter(t=>catOk(t)&&matchTodoQ(t));
    const open=hit.filter(t=>!t.done),done=hit.filter(t=>t.done);
    listHtml=(open.length?grpHead(null,'未完成',open.length,false)+grpBody('q-open',open,t=>todoRow(t)):'')
      +(done.length?grpHead(null,'已完成',done.length,false)+grpBody('q-done',done,doneRow,byDoneDesc):'')
      ||emptyBlock(`没有找到包含“${q}”的待办`,'换个关键词，或清空搜索');
  }else if(tab==='today'){
    // 逾期：按截止时间从近到远，每 3 项一页
    const ov=overdue.slice().sort((x,y)=>(y.date+' '+(y.time||'')).localeCompare(x.date+' '+(x.time||'')));
    const ovp=pagedSlice('overdue',ov,3);
    listHtml=(overdue.length?`<div class="overdue-card" style="margin-bottom:6px">
        <div class="oh">${I.warn}逾期 ${overdue.length} 项</div>
        <div class="todo-lines">${ovp.rows.map(t=>todoRow(t,{hideDate:true})).join('')}</div>${ovp.pager}</div>`:'')
      +(groups.today.length?grpBody('today',groups.today,t=>todoRow(t,{hideDate:true})):emptyBlock('今天没有安排','事情都安排好了，或添加一件新的'));
  }else if(tab==='upcoming'){
    const byDate={};
    sortTodos(groups.upcoming).forEach(t=>{(byDate[t.date]=byDate[t.date]||[]).push(t);});
    listHtml=Object.keys(byDate).sort().map(d=>
      grpHead(null,`${relDay(d)} · ${fmtCN(d)}`,byDate[d].length,false)
      +grpBody('up-'+d,byDate[d],t=>todoRow(t,{hideDate:true}))).join('')||emptyBlock('近期没有确定日期的事项','新建待办时选择日期即可安排进来');
  }else if(tab==='unscheduled'){
    const items=groups.unscheduled;
    listHtml=(items.length?`<div class="batch-bar"><span>共 ${items.length} 项还没有日期</span>

        <button type="button" data-act="batch-schedule" data-day="1">全部安排到明天</button></div>`:'')
      +(items.length?grpBody('unscheduled',items,t=>todoRow(t),byCreatedDesc):emptyBlock('待安排是空的','想到的事会先落在这儿，定好日期再排进日程'));
  }else{
    const weekAgo=addDays(T,-7);
    const recent=groups.done.filter(t=>dstr(new Date(t.doneAt))>=weekAgo);
    const older=groups.done.filter(t=>dstr(new Date(t.doneAt))<weekAgo);
    const byMonth={};
    older.forEach(t=>{const ym=dstr(new Date(t.doneAt)).slice(0,7);(byMonth[ym]=byMonth[ym]||[]).push(t);});
    listHtml=(recent.length?grpHead(null,'最近 7 天',recent.length,false)+grpBody('done-recent',recent,doneRow,byDoneDesc):'')
      +Object.keys(byMonth).sort().reverse().map(ym=>{
        const [yy,mm]=ym.split('-');
        return grpHead('done-'+ym,`${yy} 年 ${Number(mm)} 月`,byMonth[ym].length,true,false)
          +grpBody('done-'+ym,byMonth[ym],doneRow,byDoneDesc,false);
      }).join('')
      +(groups.done.length?`<div class="done-actions"><button type="button" class="btn btn-ghost" data-act="clear-done">${I.trash}清空已完成记录（移入回收站）</button></div>`:'')
      ||emptyBlock('还没有完成记录','完成的事项会沉淀在这里');
  }
  const ph={today:'添加今天的待办，回车创建',upcoming:'先记下来（无日期将进入待安排）',unscheduled:'记录一件待安排的事，回车创建',done:'已完成事项不可直接添加'}[tab];
  $('#view-todos').innerHTML=`
    <div class="page-head">
      <div><h1>待办</h1><div class="sub">个人行动清单：要做什么、什么时候做、有没有完成</div></div>
      <div class="head-actions">
        <button class="btn btn-ghost" data-act="nav" data-to="calendar">${I.cal}<span class="txt">日历查看</span></button>
        <button class="btn btn-primary" data-act="open-new-todo" data-date="${tab==='today'?T:''}">${I.plus}<span>新建待办</span></button>
      </div>
    </div>
    <div class="tabs">${TABS.map(([k,l])=>`<button class="tab ${tab===k?'active':''}" data-act="todo-tab" data-tab="${k}">${l}<span class="cnt">${cnt[k]}</span></button>`).join('')}</div>
    <div class="todo-tools">
      ${catFilter(ui.todoCat,'todo-cat')}
      <div class="tools-r">
        <label class="mini-search">${I.search}<input id="todo-search-input" type="text" data-act="todo-search" placeholder="搜索标题 / 备注 / 标签" value="${esc(ui.todoQuery)}"></label>
        ${tab!=='done'&&!q?`<select class="mini-select" data-act="todo-sort">

function bindEditor(n){
  disposeEditor();
  const body=$('#ed-body'),title=$('#ed-title'),state=$('#saveState');body.innerHTML=sanitizeHtml(n.content||'');
  let dirty=false,closed=false;
  const doSave=()=>{
    if(closed||!dirty)return;
    const current=noteById(n.id);if(current!==n){dirty=false;return;}
    n.title=title.value.trim();n.content=sanitizeHtml(body.innerHTML);n.updatedAt=Date.now();
    if(persist()){dirty=false;state.textContent='已保存';state.classList.remove('saving');}else state.textContent='保存失败，请导出备份';
  };
  const autoSave=debounce(doSave,600);
  const onChange=()=>{dirty=true;state.textContent='正在保存…';state.classList.add('saving');autoSave();};
  editorSession={flush:()=>{autoSave.cancel();doSave();},cancel:()=>{autoSave.cancel();closed=true;}};
  window._flushEditor=()=>editorSession?.flush();
  body.addEventListener('input',onChange);title.addEventListener('input',onChange);
  body.addEventListener('paste',e=>{e.preventDefault();const html=e.clipboardData.getData('text/html');const text=e.clipboardData.getData('text/plain');document.execCommand('insertHTML',false,html?sanitizeHtml(html):esc(text).replace(/\n/g,'<br>'));onChange();});
  body.addEventListener('drop',e=>e.preventDefault());
  body.addEventListener('keydown',e=>{if(e.key==='Tab'&&!e.isComposing){e.preventDefault();document.execCommand('insertHTML',false,'&emsp;&emsp;');onChange();}});
  $('#ed-image-input').addEventListener('change',e=>[...e.target.files].forEach(f=>compressInsert(f,body,onChange)));
  $('#ed-file-input').addEventListener('change',async e=>{
    const files=[...e.target.files];flushEditor();const ok=await checkFileSize(files);
    if(!DB.notes.includes(n))return;n.attachments.push(...ok);n.updatedAt=Date.now();persist();
    if(ui.editingNote===n.id&&currentRoute()==='notes')renderNotes();toast('已保存 '+ok.length+' 个附件到本机');
  });
}

function compressInsert(file,body,cb){
  if(file.size>20*1048576){toast('图片不能超过 20MB');return;}
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const maxW=1200;let {width:w,height:h}=img;
      const scale=Math.min(1,maxW/w,maxW/h);w=Math.round(w*scale);h=Math.round(h*scale);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      if(!body.isConnected||body!==$('#ed-body')){toast('图片插入已取消：笔记已切换');return;}
      body.focus();
      document.execCommand('insertHTML',false,`<img src="${cv.toDataURL('image/jpeg',.82)}" alt="${esc(file.name)}">`);
      cb();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function execEdit(cmd){
  const body=$('#ed-body');body.focus();
  if(cmd==='h1'||cmd==='h2')document.execCommand('formatBlock',false,cmd);
  else if(cmd==='quote')document.execCommand('formatBlock',false,'blockquote');
  else document.execCommand(cmd,false,null);
  body.dispatchEvent(new Event('input',{bubbles:true}));
}

function rangeOf(r){

  if(r==='week'){const d=pdate(T);const off=(d.getDay()+6)%7;const s=new Date(d);s.setDate(d.getDate()-off);const e=new Date(s);e.setDate(s.getDate()+6);return [dstr(s),dstr(e)];}
  return [T.slice(0,8)+'01',dstr(new Date(Number(T.slice(0,4)),Number(T.slice(5,7)),0))];
}
